name: BO3 Nacht Standalone Workshop Audit

on:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/bo3-nacht-standalone-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install SteamCMD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
      - name: Download Workshop 2755515831
        run: |
          set +e
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +login anonymous +workshop_download_item 311210 2755515831 validate +quit 2>&1 | tee "$RUNNER_TEMP/steamcmd.log"
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d -path '*/steamapps/workshop/content/311210/2755515831' -print -quit 2>/dev/null)
          if [ -z "$ROOT" ]; then echo 'workshop payload missing'; exit 1; fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          exit 0
      - name: Inventory
        run: |
          set -euo pipefail
          mkdir -p audit-out
          cp "$RUNNER_TEMP/steamcmd.log" audit-out/
          python3 - <<'PY'
          import collections, json, os, pathlib
          root=pathlib.Path(os.environ['ROOT'])
          files=[p for p in root.rglob('*') if p.is_file()]
          ext=collections.Counter((p.suffix.lower() or '<none>') for p in files)
          interesting=[]
          for p in files:
              rel=p.relative_to(root).as_posix()
              low=rel.lower()
              if p.suffix.lower() in {'.ff','.xpak','.zone','.map','.bsp','.d3dbsp','.gsc','.csc','.xmodel_export','.xanim_export','.xmodel_bin','.xanim_bin','.sabs','.sabl','.csv'} or any(k in low for k in ('nacht','prototype','map','zone','xmodel','xanim','material','texture','sound','zombie')):
                  interesting.append({'path':rel,'bytes':p.stat().st_size})
          interesting.sort(key=lambda x:(-x['bytes'],x['path']))
          report={'file_count':len(files),'total_bytes':sum(p.stat().st_size for p in files),'total_gib':round(sum(p.stat().st_size for p in files)/(1024**3),3),'extensions':dict(ext.most_common()),'interesting_files':interesting[:5000],'largest_files':sorted(({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size} for p in files),key=lambda x:-x['bytes'])[:300]}
          pathlib.Path('audit-out/inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2)[:30000])
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bo3-nacht-standalone-workshop-audit
          path: audit-out/
          retention-days: 7
