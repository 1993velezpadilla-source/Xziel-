name: Sanctum ASTC Texture Pack

on:
  push:
    branches:
      - engine/mobile-ktx2-astc-v1
      - engine/mobile-mip-streaming-v1
      - engine/mobile-power-fidelity-v1
    paths:
      - ".github/workflows/sanctum-astc-texture-pack.yml"
      - ".github/workflows/sanctum-native-hq-android.yml"
      - ".github/workflows/sanctum-clean-source.yml"
      - "tools/texture_pack/build_astc_pack.py"
      - "tools/church_map/apply_exterior_microdetail.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctum-astc-texture-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-astc-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT: "Xziel-Sanctum-Clean-Source"
      KTX_VERSION: "4.4.2"

    steps:
      - uses: actions/checkout@v5

      - name: Download validated Sanctum source artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN_ID=""
          for i in $(seq 1 120); do
            RESPONSE="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/sanctum-clean-source.yml/runs?branch=${GITHUB_REF_NAME}&per_page=30")"
            SOURCE_RUN_ID="$(jq -r --arg SHA "${GITHUB_SHA}" '
              .workflow_runs[]
              | select(
                  .head_sha == $SHA and
                  .status == "completed" and
                  .conclusion == "success"
                )
              | .id
            ' <<<"${RESPONSE}" | head -n 1)"

            if [[ -n "${SOURCE_RUN_ID}" && "${SOURCE_RUN_ID}" != "null" ]]; then
              break
            fi

            echo "Waiting for commit-matched Clean Source sha=${GITHUB_SHA}"
            sleep 20
          done

          test -n "${SOURCE_RUN_ID}"
          test "${SOURCE_RUN_ID}" != "null"
          SOURCE_META="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"${SOURCE_META}")" = "${GITHUB_SHA}"
          ARTIFACTS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts")"
          ARTIFACT_ID="$(jq -r --arg NAME "${SOURCE_ARTIFACT}" '.artifacts[] | select(.name == $NAME and .expired == false) | .id' <<<"${ARTIFACTS}" | head -n 1)"
          test -n "${ARTIFACT_ID}"
          test "${ARTIFACT_ID}" != "null"
          echo "Using commit-matched Clean Source run ${SOURCE_RUN_ID} sha=${GITHUB_SHA}"
          mkdir -p pack/root
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > pack/source.zip
          unzip -q pack/source.zip -d pack/root
          STATIC_ROOT="$(find pack/root -type d -path '*/xziel_native_static' -print -quit)"
          STATIC_REPORT="$(find pack/root -name 'xziel_native_static_mesh_report.json' -print -quit)"
          test -d "${STATIC_ROOT}"
          test -s "${STATIC_REPORT}"
          jq -e '.spatialBatching == "morton_grid_centroid_v1"' "${STATIC_REPORT}"
          jq -e '.sourceTriangles == .runtimeTriangles' "${STATIC_REPORT}"
          jq -e '.version == 5' "${STATIC_REPORT}"
          jq -e '.generatedPbrApplied == true' "${STATIC_REPORT}"
          jq -e '.generatedPbrResolution == [4096,4096]' "${STATIC_REPORT}"
          jq -e '.generatedPbrBatchCount > 0' "${STATIC_REPORT}"
          jq -e '.photogrammetryPbrBatchCount == .generatedPbrBatchCount' "${STATIC_REPORT}"
          jq -e '.generatedPbrMaterials | length == 1' "${STATIC_REPORT}"
          jq -e '.batchCount == 333' "${STATIC_REPORT}"
          jq -e '.maxTrianglesPerBatch <= 9000' "${STATIC_REPORT}"
          jq -e '.totalVertices == 2406868' "${STATIC_REPORT}"
          NORMAL_REL="$(jq -r '.generatedPbrNormalTexture' "${STATIC_REPORT}")"
          ORM_REL="$(jq -r '.generatedPbrOrmTexture' "${STATIC_REPORT}")"
          test -s "${STATIC_ROOT}/${NORMAL_REL}"
          test -s "${STATIC_ROOT}/${ORM_REL}"
          PNG_COUNT="$(find "${STATIC_ROOT}/textures" -type f -name '*.png' | wc -l)"
          test "${PNG_COUNT}" -gt 0
          echo "XZIEL_ASTC_SOURCE_PNGS=${PNG_COUNT}"

      - name: Install pinned Khronos KTX tools
        shell: bash
        run: |
          set -euo pipefail
          DEB="KTX-Software-${KTX_VERSION}-Linux-x86_64.deb"
          BASE="https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}"
          curl --fail --location --retry 3 "${BASE}/${DEB}" -o "/tmp/${DEB}"
          curl --fail --location --retry 3 "${BASE}/${DEB}.sha1" -o "/tmp/${DEB}.sha1"
          (cd /tmp && sha1sum -c "${DEB}.sha1")
          sudo apt-get update -qq
          sudo apt-get install -y -qq "/tmp/${DEB}"
          ktx --version
          ktx create --help >/dev/null
          ktx validate --help >/dev/null

      - name: Encode and validate ASTC mip chains
        shell: bash
        run: |
          set -euo pipefail
          STATIC_ROOT="$(find pack/root -type d -path '*/xziel_native_static' -print -quit)"
          python3 tools/texture_pack/build_astc_pack.py \
            --root "${STATIC_ROOT}/textures" \
            --report pack/root/xziel_astc_texture_report.json \
            --ktx ktx \
            --quality medium
          jq -e '.codec == "ASTC_LDR"' pack/root/xziel_astc_texture_report.json
          jq -e '.block == "6x6"' pack/root/xziel_astc_texture_report.json
          jq -e '.pngCount == .ktx2Count and .ktx2Count > 0' pack/root/xziel_astc_texture_report.json
          jq -e '.textures | all(.levels > 0 and .vkFormat >= 157 and .vkFormat <= 184)' pack/root/xziel_astc_texture_report.json
          jq -e '.textures | any(.semantic == "normal" and .width == 4096 and .height == 4096 and .srgb == false)' pack/root/xziel_astc_texture_report.json
          jq -e '.textures | any(.semantic == "linear-data" and .width == 4096 and .height == 4096 and .srgb == false)' pack/root/xziel_astc_texture_report.json
          jq -e '.textures | any(.semantic == "photo-detail" and .width == 2048 and .height == 2048 and .srgb == false and .mipWrap == "wrap")' pack/root/xziel_astc_texture_report.json
          jq -e '.textures | any(.semantic == "color" and .width == 1024 and .height == 1024 and (.source | contains("Exterior04")))' pack/root/xziel_astc_texture_report.json
          jq '{codec, block, quality, pngCount, ktx2Count, pngBytes, ktx2Bytes, ktx2ToPngRatio, semantics: ([.textures[].semantic] | unique)}' pack/root/xziel_astc_texture_report.json

      - name: Upload validated ASTC runtime pack
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Sanctum-Clean-Source-ASTC
          path: pack/root/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
