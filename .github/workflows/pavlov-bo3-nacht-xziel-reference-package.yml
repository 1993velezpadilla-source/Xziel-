name: Pavlov BO3 Nacht XZIEL Reference Package

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-xziel-reference-package.yml"
      - "tools/maps/build_xziel_nacht_reference_package.py"
      - "experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v1.json"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download Pavlov Nacht Workshop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'steamcmd.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'steamcmd.zip') -DestinationPath $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item 555160 2755515831 validate +quit
          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName -like '*steamapps\workshop\content\555160\2755515831'} | Select-Object -First 1
          if(-not $root){throw 'payload not found'}
          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not(Test-Path $pak)){throw 'pak missing'}
          "PAK=$pak" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Unpack map and export UAssetAPI JSON
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'repak.zip')
          $rd=Join-Path $env:RUNNER_TEMP 'repak'
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'repak.zip') -DestinationPath $rd -Force
          $repak=Get-ChildItem $rd -Filter repak.exe -Recurse | Select-Object -First 1
          $out=Join-Path $env:RUNNER_TEMP 'unpacked'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $repak.FullName unpack $env:PAK -o $out
          if($LASTEXITCODE -ne 0){throw 'repak failed'}
          $map=Get-ChildItem $out -Filter 'Nacht_de_Untoten.umap' -Recurse | Select-Object -First 1
          if(-not $map){throw 'map missing'}
          Invoke-WebRequest 'https://github.com/atenfyr/UAssetGUI/releases/download/v1.1.0/UAssetGUI.exe' -OutFile (Join-Path $env:RUNNER_TEMP 'UAssetGUI.exe')
          New-Item -ItemType Directory -Force -Path audit-out | Out-Null
          & (Join-Path $env:RUNNER_TEMP 'UAssetGUI.exe') tojson $map.FullName 'audit-out\Nacht_de_Untoten.json' VER_UE4_21
          if($LASTEXITCODE -ne 0){throw 'UAssetGUI failed'}
          $json=Get-ChildItem $PWD,$env:RUNNER_TEMP -Recurse -File -Filter 'Nacht_de_Untoten.json' -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $json){throw 'map JSON not found'}
          "MAP_JSON=$($json.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build layered XZIEL reference package
        shell: pwsh
        run: |
          $dest='audit-out\xziel-nacht-reference'
          python tools/maps/build_xziel_nacht_reference_package.py $env:MAP_JSON experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v1.json $dest
          if($LASTEXITCODE -ne 0){throw 'XZIEL Nacht package preflight failed'}
          Get-Content (Join-Path $dest 'preflight.json')

      - name: Upload metadata package only
        uses: actions/upload-artifact@v4
        with:
          name: xziel-bo3-nacht-reference-package
          path: audit-out/xziel-nacht-reference/
          if-no-files-found: error
          retention-days: 7
