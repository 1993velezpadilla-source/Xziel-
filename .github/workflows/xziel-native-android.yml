name: Xziel Native Android Prototype

on:
  workflow_dispatch:
  push:
    branches:
      - feature/xziel-engine-foundation
    paths:
      - "engine/**"
      - "xziel-native-android/**"
      - ".github/workflows/xziel-native-android.yml"
  pull_request:
    paths:
      - "engine/**"
      - "xziel-native-android/**"
      - ".github/workflows/xziel-native-android.yml"

concurrency:
  group: xziel-native-prototype-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-37"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"

      - name: Build Xziel GameActivity Vulkan APK
        working-directory: xziel-native-android
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="xziel-native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee xziel-native-apk-contents.txt

          grep -q "lib/arm64-v8a/libxziel-native.so" xziel-native-apk-contents.txt
          grep -q "lib/x86_64/libxziel-native.so" xziel-native-apk-contents.txt

          mkdir -p dist
          cp "$APK" dist/Xziel-Engine-Vulkan-Prototype-debug.apk
          ls -lh dist/Xziel-Engine-Vulkan-Prototype-debug.apk

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Engine-Vulkan-Prototype-debug
          path: dist/Xziel-Engine-Vulkan-Prototype-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK structure report
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Engine-Vulkan-Prototype-report
          path: xziel-native-apk-contents.txt
          if-no-files-found: error
          retention-days: 14
