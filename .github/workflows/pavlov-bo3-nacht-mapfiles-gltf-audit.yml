name: Pavlov BO3 Nacht MAP_FILES glTF Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-mapfiles-gltf-audit.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full file libsdl2-dev zlib1g-dev libpng-dev build-essential perl git

      - name: Install SteamCMD and download Pavlov Nacht
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          set +e
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +login anonymous +workshop_download_item 555160 2755515831 validate +quit 2>&1 | tee "$RUNNER_TEMP/steamcmd.log"
          set -e
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d -path '*/steamapps/workshop/content/555160/2755515831' -print -quit 2>/dev/null)
          test -n "$ROOT"
          test -f "$ROOT/WindowsNoEditor.pak"
          echo "PAK=$ROOT/WindowsNoEditor.pak" >> "$GITHUB_ENV"

      - name: Unpack Pavlov PAK
        run: |
          set -euo pipefail
          curl -fL https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/repak.tar.xz"
          mkdir -p "$RUNNER_TEMP/repak"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name repak -perm -111 | head -1)
          test -n "$REPAK"
          mkdir -p "$RUNNER_TEMP/pavlov-unpacked"
          "$REPAK" unpack "$PAK" -o "$RUNNER_TEMP/pavlov-unpacked"
          test -d "$RUNNER_TEMP/pavlov-unpacked/Pavlov/Content/CustomMaps/UGC2755515831/CoD_nacht/MAP_FILES"
          echo "UNPACKED=$RUNNER_TEMP/pavlov-unpacked" >> "$GITHUB_ENV"

      - name: Build UE Viewer / umodel
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/gildor2/UEViewer.git "$RUNNER_TEMP/UEViewer"
          cd "$RUNNER_TEMP/UEViewer"
          ./build.sh
          UMODEL=$(find . -type f -name umodel -perm -111 | head -1)
          test -n "$UMODEL"
          UMODEL=$(realpath "$UMODEL")
          echo "UMODEL=$UMODEL" >> "$GITHUB_ENV"
          "$UMODEL" -version | tee "$RUNNER_TEMP/umodel-version.txt"

      - name: Export all Nacht MAP_FILES static meshes to glTF
        run: |
          set -euo pipefail
          mkdir -p audit-out "$RUNNER_TEMP/umodel-export"
          MAPROOT="$UNPACKED/Pavlov/Content/CustomMaps/UGC2755515831/CoD_nacht/MAP_FILES"
          find "$MAPROOT" -type f -name '*.uasset' | sort > audit-out/mapfiles-uassets.txt
          TOTAL=$(wc -l < audit-out/mapfiles-uassets.txt)
          echo "uasset_count=$TOTAL" | tee audit-out/export-summary.txt
          : > audit-out/umodel-results.tsv
          ok=0; fail=0
          while IFS= read -r file; do
            rel=${file#"$UNPACKED/"}
            log="$RUNNER_TEMP/umodel-one.log"
            if "$UMODEL" -export -gltf -game=ue4.21 -path="$UNPACKED" -out="$RUNNER_TEMP/umodel-export" "$rel" >"$log" 2>&1; then
              status=ok; ok=$((ok+1))
            else
              status=fail; fail=$((fail+1))
            fi
            first=$(grep -E 'Exporting|ERROR|WARNING|StaticMesh|glTF' "$log" | head -1 | tr '\t' ' ' || true)
            printf '%s\t%s\t%s\n' "$status" "$rel" "$first" >> audit-out/umodel-results.tsv
          done < audit-out/mapfiles-uassets.txt
          echo "ok=$ok" | tee -a audit-out/export-summary.txt
          echo "fail=$fail" | tee -a audit-out/export-summary.txt

          find "$RUNNER_TEMP/umodel-export" -type f -printf '%s\t%p\n' | sort -nr > audit-out/exported-files.tsv || true
          python3 - <<'PY'
          import collections,json,pathlib,os
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'umodel-export'
          files=[p for p in base.rglob('*') if p.is_file()] if base.exists() else []
          ext=collections.Counter((p.suffix.lower() or '<none>') for p in files)
          total=sum(p.stat().st_size for p in files)
          gltf=[p for p in files if p.suffix.lower()=='.gltf']
          bins=[p for p in files if p.suffix.lower()=='.bin']
          textures=[p for p in files if p.suffix.lower() in {'.tga','.png','.dds','.jpg','.jpeg'}]
          report={
            'source':'Pavlov Workshop 2755515831 / CoD_nacht/MAP_FILES',
            'engine_override':'ue4.21',
            'export_file_count':len(files),
            'export_total_bytes':total,
            'extensions':dict(ext.most_common()),
            'gltf_count':len(gltf),
            'bin_count':len(bins),
            'texture_count':len(textures),
            'largest':[{'path':p.relative_to(base).as_posix(),'bytes':p.stat().st_size} for p in sorted(files,key=lambda x:-x.stat().st_size)[:200]],
          }
          pathlib.Path('audit-out/gltf-export-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2)[:30000])
          PY

          cp "$RUNNER_TEMP/umodel-version.txt" audit-out/ || true

      - name: Upload audit report only
        uses: actions/upload-artifact@v4
        with:
          name: pavlov-bo3-nacht-mapfiles-gltf-audit
          path: audit-out/
          retention-days: 7
