name: Sanctum Exterior Detail A-B Source

on:
  push:
    branches:
      - engine/mobile-power-fidelity-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctum-clean-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-clean-source:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GAMEPLAY_SEED_RUN_ID: "35785664048"

    steps:
      - uses: actions/checkout@v5

      - name: Install clean-source dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy libegl1 libgl1-mesa-dri libglx-mesa0 xvfb
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet objaverse pillow
          blender --version

      - name: Recover validated Xziel gameplay only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p church/seed/dev church/seed/hq church/out/clean

          ARTIFACTS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GAMEPLAY_SEED_RUN_ID}/artifacts")"
          DEV_ID="$(jq -r '.artifacts[] | select(.name == "Xziel-Sanctum-of-Ash-Runtime-Blockout") | .id' <<<"$ARTIFACTS" | head -n1)"
          HQ_ID="$(jq -r '.artifacts[] | select(.name == "Xziel-Sanctum-Native-HQ") | .id' <<<"$ARTIFACTS" | head -n1)"
          test -n "$DEV_ID"
          test -n "$HQ_ID"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEV_ID}/zip" > church/seed/dev.zip
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HQ_ID}/zip" > church/seed/hq.zip
          unzip -q church/seed/dev.zip -d church/seed/dev
          unzip -q church/seed/hq.zip -d church/seed/hq

          PLAN="$(find church/seed/dev -name zombies_map_plan.json -print -quit)"
          XMAP="$(find church/seed/hq -path '*/xziel_native_map/sanctum.xmap' -print -quit)"
          XMAP_REPORT="$(find church/seed/hq -path '*/xziel_native_map/sanctum_native_map_report.json' -print -quit)"
          test -s "$PLAN"
          test -s "$XMAP"
          test -s "$XMAP_REPORT"

          cp "$PLAN" church/seed/zombies_map_plan.json
          mkdir -p church/out/clean/xziel_native_map
          cp "$XMAP" church/out/clean/xziel_native_map/sanctum.xmap
          cp "$XMAP_REPORT" church/out/clean/xziel_native_map/sanctum_native_map_report.json

          WEAPON_MODEL="$(find church/seed/hq -path '*/xziel_native_static/models/xziel/weapons/standard_rifle.xzsm' -print -quit)"
          WEAPON_TEXTURES="$(find church/seed/hq -type d -path '*/xziel_native_static/textures/xziel/weapons/standard_rifle' -print -quit)"
          WEAPON_AUDIO="$(find church/seed/hq -type d -path '*/xziel_native_static/audio/xziel/weapons' -print -quit)"
          WEAPON_LICENSE="$(find church/seed/hq -path '*/xziel_native_static/licenses/standard_rifle_assets.txt' -print -quit)"

          mkdir -p church/out/clean/xziel_native_static/models/xziel/weapons
          mkdir -p church/out/clean/xziel_native_static/textures/xziel/weapons/standard_rifle
          mkdir -p church/out/clean/xziel_native_static/audio/xziel/weapons
          mkdir -p church/out/clean/xziel_native_static/licenses

          cp "$WEAPON_MODEL" church/out/clean/xziel_native_static/models/xziel/weapons/standard_rifle.xzsm
          cp -a "$WEAPON_TEXTURES"/. church/out/clean/xziel_native_static/textures/xziel/weapons/standard_rifle/
          cp -a "$WEAPON_AUDIO"/. church/out/clean/xziel_native_static/audio/xziel/weapons/
          cp "$WEAPON_LICENSE" church/out/clean/xziel_native_static/licenses/standard_rifle_assets.txt

      - name: Fetch untouched original St Giles GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p church/source
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          import objaverse

          uid = "b92917ff83914adc8bc93959ba8b4399"
          annotations = objaverse.load_annotations([uid])
          ann = annotations.get(uid)
          if not ann:
              raise SystemExit("original St Giles source is missing from Objaverse")
          if ann.get("license") != "by":
              raise SystemExit(f"unexpected source license {ann.get('license')!r}")

          objects = objaverse.load_objects([uid], download_processes=1)
          source = objects.get(uid)
          if not source:
              raise SystemExit("original St Giles GLB download failed")

          out = Path("church/source")
          shutil.copy2(source, out / "st-giles-cripplegate.glb")
          (out / "source_metadata.json").write_text(
              json.dumps(ann, indent=2),
              encoding="utf-8",
          )
          print("ORIGINAL_SOURCE", source)
          PY

      - name: Audit original embedded texture fidelity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import struct
          from pathlib import Path

          from PIL import Image

          glb = Path("church/source/st-giles-cripplegate.glb")
          data = glb.read_bytes()
          if data[:4] != b"glTF":
              raise SystemExit("not a GLB")

          _, version, total_length = struct.unpack_from("<4sII", data, 0)
          if version != 2 or total_length != len(data):
              raise SystemExit(f"unexpected GLB header version={version} total={total_length} actual={len(data)}")

          cursor = 12
          json_chunk = None
          bin_chunk = None
          while cursor + 8 <= len(data):
              length, kind = struct.unpack_from("<II", data, cursor)
              cursor += 8
              payload = data[cursor:cursor+length]
              cursor += length
              if kind == 0x4E4F534A:
                  json_chunk = payload.rstrip(b"\x00 \t\r\n")
              elif kind == 0x004E4942:
                  bin_chunk = payload

          if json_chunk is None or bin_chunk is None:
              raise SystemExit("GLB missing JSON/BIN chunk")

          doc = json.loads(json_chunk.decode("utf-8"))
          buffer_views = doc.get("bufferViews", [])
          images = doc.get("images", [])
          textures = doc.get("textures", [])
          materials = doc.get("materials", [])

          out_dir = Path("church/out/clean/original_embedded_textures")
          out_dir.mkdir(parents=True, exist_ok=True)

          records = []
          decoded_hash_to_indices = {}

          for index, image in enumerate(images):
              view_index = image.get("bufferView")
              if view_index is None:
                  continue
              view = buffer_views[view_index]
              offset = int(view.get("byteOffset", 0))
              size = int(view["byteLength"])
              payload = bin_chunk[offset:offset+size]
              if len(payload) != size:
                  raise SystemExit(f"truncated image bufferView {view_index}")

              with Image.open(io.BytesIO(payload)) as im:
                  rgba = im.convert("RGBA")
                  pixel_bytes = rgba.tobytes()
                  pixel_hash = hashlib.sha256(pixel_bytes).hexdigest()
                  dimensions = [rgba.width, rgba.height]
                  rgba.save(out_dir / f"source_{index:02d}.png")

              record = {
                  "imageIndex": index,
                  "name": image.get("name"),
                  "mimeType": image.get("mimeType"),
                  "encodedBytes": size,
                  "encodedSha256": hashlib.sha256(payload).hexdigest(),
                  "decodedRgbaSha256": pixel_hash,
                  "dimensions": dimensions,
              }
              records.append(record)
              decoded_hash_to_indices.setdefault(pixel_hash, []).append(index)

          material_usage = []
          for mi, material in enumerate(materials):
              pbr = material.get("pbrMetallicRoughness", {})
              base = pbr.get("baseColorTexture", {}).get("index")
              mr = pbr.get("metallicRoughnessTexture", {}).get("index")
              normal = material.get("normalTexture", {}).get("index")
              occlusion = material.get("occlusionTexture", {}).get("index")

              def image_index(texture_index):
                  if texture_index is None or texture_index >= len(textures):
                      return None
                  return textures[texture_index].get("source")

              material_usage.append({
                  "materialIndex": mi,
                  "name": material.get("name"),
                  "baseColorImage": image_index(base),
                  "metallicRoughnessImage": image_index(mr),
                  "normalImage": image_index(normal),
                  "occlusionImage": image_index(occlusion),
              })

          report = {
              "glbVersion": version,
              "glbBytes": len(data),
              "imageCount": len(images),
              "embeddedImageCount": len(records),
              "textureCount": len(textures),
              "materialCount": len(materials),
              "images": records,
              "materials": material_usage,
              "uniqueDecodedImageCount": len(decoded_hash_to_indices),
          }

          Path("church/out/clean/original_texture_audit.json").write_text(
              json.dumps(report, indent=2),
              encoding="utf-8",
          )
          print("ORIGINAL_TEXTURE_AUDIT", json.dumps({
              "images": len(records),
              "uniqueDecoded": len(decoded_hash_to_indices),
              "sizes": sorted({tuple(r["dimensions"]) for r in records}),
              "materialUsage": material_usage,
          }))
          PY

      - name: Direct-export original GLB to Xziel
        shell: bash
        env:
          CHURCH_SOURCE: church/source/st-giles-cripplegate.glb
          CHURCH_PLAN: church/seed/zombies_map_plan.json
          XZIEL_STATIC_RUNTIME_ROOT: church/out/clean/xziel_native_static
          XZIEL_STATIC_REPORT: church/out/clean/xziel_native_static_mesh_report.json
          XZIEL_STATIC_NATIVE_FLOOR_Y: "-1.58"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24"             blender --background             --python tools/church_map/export_xziel_original_clean.py             2>&1 | tee church/out/clean/clean-source-export.log

      - name: Apply matched 4K stone micro-detail to exterior atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p church/out/clean/material-ab
          curl --fail --location --retry 3 \
            "https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/medieval_blocks_03/medieval_blocks_03_diff_4k.jpg" \
            -o church/out/clean/material-ab/medieval_blocks_03_diff_4k.jpg

          python3 tools/church_map/apply_exterior_microdetail.py \
            --report church/out/clean/xziel_native_static_mesh_report.json \
            --runtime-root church/out/clean/xziel_native_static \
            --detail church/out/clean/material-ab/medieval_blocks_03_diff_4k.jpg \
            --out-report church/out/clean/exterior_microdetail_ab_report.json

          jq -e '.microdetailApplied == true' \
            church/out/clean/xziel_native_static_mesh_report.json
          jq -e '.microdetailCandidate == "polyhaven_medieval_blocks_03"' \
            church/out/clean/xziel_native_static_mesh_report.json
          jq -e '.runtimeExteriorResolution == [4096,4096]' \
            church/out/clean/xziel_native_static_mesh_report.json

      - name: Validate clean visual lineage
        shell: bash
        run: |
          set -euo pipefail
          R=church/out/clean/xziel_native_static_mesh_report.json
          M=church/out/clean/xziel_native_static/models/xziel/sanctum/sanctum.xzsm
          X=church/out/clean/xziel_native_map/sanctum.xmap
          XR=church/out/clean/xziel_native_map/sanctum_native_map_report.json

          test -s "$R"
          test -s "$M"
          test -s "$X"
          test -s "$XR"

          jq -e '.pipeline == "original_glb_direct"' "$R"
          jq -e '.sourceUid == "b92917ff83914adc8bc93959ba8b4399"' "$R"
          jq -e '.sourceCollection == "DIRECT_ORIGINAL_GLB"' "$R"
          jq -e '.sourceTriangles >= 2700000' "$R"
          jq -e '.runtimeTriangles == .sourceTriangles' "$R"
          jq -e '(.doubleSidedBatchCount + .backfaceCulledBatchCount) == .batchCount' "$R"
          jq -e '.backfaceCulledBatchCount > 0' "$R"
          jq -e '.dressingTriangles == 0' "$R"
          jq -e '.decimateRatio == 1' "$R"
          jq -e '.scanCleanup == "disabled"' "$R"
          jq -e '.vertexLighting == "identity_white"' "$R"
          jq -e '.textureSourceMode == "original_glb_embedded_pixels_plus_matched_exterior_microdetail"' "$R"
          jq -e '.textureCount > 0' "$R"
          jq -e '.microdetailApplied == true' "$R"
          jq -e '.microdetailCandidate == "polyhaven_medieval_blocks_03"' "$R"
          jq -e '.runtimeExteriorResolution == [4096,4096]' "$R"
          jq -e '.exactSourcePixelTextures == (.textureCount - 1)' "$R"
          jq -e '[.materialReport[] | select(.exactSourcePixels == false)] | length == 1' "$R"
          jq -e '.fallbackMaterials | length == 0' "$R"

          A=church/out/clean/original_texture_audit.json
          test -s "$A"
          jq -e '.embeddedImageCount > 0' "$A"
          jq -e '.images | all(.dimensions[0] == 1024 and .dimensions[1] == 1024)' "$A"

          jq -e '.schemaVersion == 2' "$XR"
          jq -e '.floorCount == 216' "$XR"
          jq -e '.doorCount == 7' "$XR"
          jq -e '.windowCount == 28' "$XR"
          jq -e '.zombieSpawnCount == 28' "$XR"

          if find church/out/clean -type f | grep -Eiq '(\.bsp$|\.pak$|sanctum_harness|/nzp/|/id1/)'; then
            echo "ERROR: legacy Quake/NZP visual payload leaked into clean source"
            exit 1
          fi

          jq '{
            pipeline,
            sourceTriangles,
            runtimeTriangles,
            dressingTriangles,
            decimateRatio,
            vertexLighting,
            textureCount,
            originalMaxTextureDimension,
            pbrLinkedMaterialCounts,
            batchCount,
            modelBytes,
            boundsMin,
            boundsMax
          }' "$R"

      - name: Upload clean original-source runtime
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Sanctum-Clean-Source
          path: |
            church/out/clean/xziel_native_static/
            church/out/clean/xziel_native_static_mesh_report.json
            church/out/clean/xziel_native_map/
            church/out/clean/original_texture_audit.json
            church/out/clean/original_embedded_textures/
            church/out/clean/exterior_microdetail_ab_report.json
            church/source/source_metadata.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
