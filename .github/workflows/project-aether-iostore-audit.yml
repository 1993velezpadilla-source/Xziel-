name: Project Aether IoStore Audit

on:
  push:
    branches:
      - experiment/project-aether-golden-reference
    paths:
      - ".github/workflows/project-aether-iostore-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full xz-utils

      - name: Download official Project Aether build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader \
            --url "https://verrial.itch.io/projectaether" \
            --downloadDirectory "$RUNNER_TEMP/aether-download"
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -name '*.zip' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -n "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"

      - name: Extract cooked Project Aether package files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-extracted"
          7z x -y "$PAYLOAD" \
            'ProjectAether/Content/Paks/ProjectAether-Windows.utoc' \
            'ProjectAether/Content/Paks/ProjectAether-Windows.ucas' \
            'ProjectAether/Content/Paks/ProjectAether-Windows.pak' \
            'ProjectAether/Content/Paks/global.utoc' \
            'ProjectAether/Content/Paks/global.ucas' \
            -o"$RUNNER_TEMP/aether-extracted"
          find "$RUNNER_TEMP/aether-extracted" -type f -printf '%s %p\n' | sort -nr

      - name: Download retoc
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            https://github.com/trumank/retoc/releases/download/v0.1.5/retoc_cli-x86_64-unknown-linux-gnu.tar.xz \
            -o "$RUNNER_TEMP/retoc.tar.xz"
          mkdir -p "$RUNNER_TEMP/retoc"
          tar -xJf "$RUNNER_TEMP/retoc.tar.xz" -C "$RUNNER_TEMP/retoc"
          RETOC=$(find "$RUNNER_TEMP/retoc" -type f -name 'retoc*' -perm -111 | head -1)
          test -n "$RETOC"
          echo "RETOC=$RETOC" >> "$GITHUB_ENV"
          "$RETOC" --version || true

      - name: List IoStore contents
        run: |
          set +e
          mkdir -p audit-out
          MAIN="$RUNNER_TEMP/aether-extracted/ProjectAether/Content/Paks/ProjectAether-Windows.utoc"
          GLOBAL="$RUNNER_TEMP/aether-extracted/ProjectAether/Content/Paks/global.utoc"
          "$RETOC" info "$MAIN" > audit-out/main-info.txt 2>&1
          echo $? > audit-out/main-info.rc
          "$RETOC" list "$MAIN" > audit-out/main-list.txt 2>&1
          echo $? > audit-out/main-list.rc
          "$RETOC" info "$GLOBAL" > audit-out/global-info.txt 2>&1
          echo $? > audit-out/global-info.rc
          "$RETOC" list "$GLOBAL" > audit-out/global-list.txt 2>&1
          echo $? > audit-out/global-list.rc
          python3 - <<'PY'
          import json, pathlib, re
          def parse(name):
              p=pathlib.Path('audit-out')/name
              txt=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              lines=[x.strip() for x in txt.splitlines() if x.strip()]
              hits=[]
              needles=('nacht','prototype','zombie','map','level','world','weapon','thompson','xmodel','mesh','material','anim','fx','sound','audio','barrier','window','spawn')
              for x in lines:
                  lo=x.lower()
                  if any(n in lo for n in needles): hits.append(x)
              return {'line_count':len(lines),'hits':hits[:10000],'raw_head':lines[:200]}
          report={'main':parse('main-list.txt'),'global':parse('global-list.txt')}
          pathlib.Path('audit-out/iostore-report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2)[:40000])
          PY
          exit 0

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: project-aether-iostore-audit
          path: audit-out/
          if-no-files-found: error
          retention-days: 7
