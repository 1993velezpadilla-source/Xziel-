name: Pavlov BO3 Nacht XZIEL Reference Package

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-xziel-reference-package.yml"
      - "tools/maps/build_xziel_nacht_reference_package.py"
      - "experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v2.json"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified GREEN Nacht source audit
        uses: actions/download-artifact@v4
        with:
          name: pavlov-bo3-nacht-uassetgui-audit
          path: audit-source
          github-token: ${{ github.token }}
          run-id: 36226521409

      - name: Verify source evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s audit-source/Nacht_de_Untoten.json
          test -s audit-source/nacht-spatial-manifest.json
          test -s experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v2.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          repair=json.loads(Path("experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v2.json").read_text())
          assert repair["validation"]["gate"] == "PASS"
          assert repair["validation"]["slot_count"] == 9
          assert repair["validation"]["unresolved_slot_count"] == 0
          print("verified wallbuy v2: 9/9, unresolved=0")
          PY

      - name: Build layered XZIEL reference package
        shell: bash
        run: |
          set -euo pipefail
          dest="audit-out/xziel-nacht-reference"
          mkdir -p "$dest"
          python3 tools/maps/build_xziel_nacht_reference_package.py \
            audit-source/Nacht_de_Untoten.json \
            experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v2.json \
            "$dest"
          cat "$dest/preflight.json"

      - name: Upload metadata package only
        uses: actions/upload-artifact@v4
        with:
          name: xziel-bo3-nacht-reference-package
          path: audit-out/xziel-nacht-reference/
          if-no-files-found: error
          retention-days: 7

      - name: Persist validated XZIEL Nacht metadata
        shell: bash
        run: |
          set -euo pipefail
          dest="experiments/bo3_nacht_reference/xziel_reference_package"
          mkdir -p "$dest"
          find "$dest" -maxdepth 1 -type f -name '*.json' -delete
          cp -a audit-out/xziel-nacht-reference/*.json "$dest"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"

          if git diff --cached --quiet; then
            echo "XZIEL Nacht metadata already current"
            exit 0
          fi

          git commit -m "data: persist validated XZIEL Nacht reference package"
          git fetch origin experiment/bo3-nacht-standalone-audit
          git rebase origin/experiment/bo3-nacht-standalone-audit
          git push origin HEAD:experiment/bo3-nacht-standalone-audit
