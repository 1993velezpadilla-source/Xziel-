name: Xziel Native Android Prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "engine/**"
      - "xziel-native-android/**"
      - ".github/workflows/xziel-native-android.yml"

concurrency:
  group: xziel-native-prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-native-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36.1"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Compile Xziel GLSL to SPIR-V assets
        working-directory: xziel-native-android
        shell: bash
        run: |
          set -euo pipefail

          GLSLC="$(find "${ANDROID_HOME}/ndk/28.2.13676358" -type f -name glslc -perm -111 -print -quit)"
          test -n "$GLSLC"

          mkdir -p app/src/main/assets/shaders

          "$GLSLC"             -O             -fshader-stage=vert             app/src/main/shaders/xziel_first.vert             -o app/src/main/assets/shaders/xziel_first.vert.spv

          "$GLSLC"             -O             -fshader-stage=frag             app/src/main/shaders/xziel_first.frag             -o app/src/main/assets/shaders/xziel_first.frag.spv

          "$GLSLC"             -O             -fshader-stage=vert             app/src/main/shaders/xziel_ui.vert             -o app/src/main/assets/shaders/xziel_ui.vert.spv

          "$GLSLC"             -O             -fshader-stage=frag             app/src/main/shaders/xziel_ui.frag             -o app/src/main/assets/shaders/xziel_ui.frag.spv

          test -s app/src/main/assets/shaders/xziel_first.vert.spv
          test -s app/src/main/assets/shaders/xziel_first.frag.spv
          test -s app/src/main/assets/shaders/xziel_ui.vert.spv
          test -s app/src/main/assets/shaders/xziel_ui.frag.spv

          SPIRV_VAL="$(find "${ANDROID_HOME}/ndk/28.2.13676358" -type f -name spirv-val -perm -111 -print -quit || true)"
          if [[ -n "$SPIRV_VAL" ]]; then
            "$SPIRV_VAL" app/src/main/assets/shaders/xziel_first.vert.spv
            "$SPIRV_VAL" app/src/main/assets/shaders/xziel_first.frag.spv
            "$SPIRV_VAL" app/src/main/assets/shaders/xziel_ui.vert.spv
            "$SPIRV_VAL" app/src/main/assets/shaders/xziel_ui.frag.spv
          fi

      - name: Build Xziel GameActivity Vulkan APK
        working-directory: xziel-native-android
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="xziel-native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee xziel-native-apk-contents.txt

          grep -q "lib/arm64-v8a/libxziel-native.so" xziel-native-apk-contents.txt
          grep -q "lib/x86_64/libxziel-native.so" xziel-native-apk-contents.txt
          grep -q "assets/shaders/xziel_first.vert.spv" xziel-native-apk-contents.txt
          grep -q "assets/shaders/xziel_first.frag.spv" xziel-native-apk-contents.txt
          grep -q "assets/shaders/xziel_ui.vert.spv" xziel-native-apk-contents.txt
          grep -q "assets/shaders/xziel_ui.frag.spv" xziel-native-apk-contents.txt
          grep -q "assets/maps/prototype.xmap" xziel-native-apk-contents.txt

          # Android 15+ devices may use 16 KB memory pages. Verify that the APK
          # zip layout and every native ELF LOAD segment are compatible.
          ZIPALIGN="${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          rm -rf build/xziel-elf-check
          mkdir -p build/xziel-elf-check
          unzip -q "$APK" "lib/*/*.so" -d build/xziel-elf-check

          OBJDUMP="${ANDROID_HOME}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          READELF="${ANDROID_HOME}/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          while IFS= read -r -d '' SO; do
            echo "Checking 16 KB LOAD alignment: $SO"
            "$OBJDUMP" -p "$SO" | awk '
              $1 == "LOAD" {
                found = 1
                for (i = 1; i <= NF; ++i) {
                  if ($i == "align") {
                    split($(i+1), parts, "\\*\\*")
                    if ((parts[2] + 0) < 14) {
                      bad = 1
                    }
                  }
                }
              }
              END {
                if (!found || bad) {
                  exit 1
                }
              }
            '

            echo "Checking GNU_RELRO: $SO"
            RELRO_REPORT="$(mktemp)"
            "$READELF" -l "$SO" > "$RELRO_REPORT"
            grep -q "GNU_RELRO" "$RELRO_REPORT"
            rm -f "$RELRO_REPORT"
          done < <(find build/xziel-elf-check -type f -name '*.so' -print0)

          mkdir -p dist
          cp "$APK" dist/Xziel-Engine-Vulkan-Prototype-debug.apk
          ls -lh dist/Xziel-Engine-Vulkan-Prototype-debug.apk

      - name: Boot native prototype and verify first render
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-native-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" dist
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd             --force             --name xziel-native-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR"             @xziel-native-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory 2048             > dist/native-emulator-stdout.txt 2>&1 &
          EMU_PID=$!

          sleep 5
          kill -0 "$EMU_PID"

          timeout 150 "$ADB" wait-for-device
          BOOTED=0
          for i in $(seq 1 75); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"

          APK="xziel-native-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ADB" install -r "$APK"
          "$ADB" logcat -c
          "$ADB" shell am force-stop com.xziel.engineprototype || true
          "$ADB" shell am start -W             -n com.xziel.engineprototype/.XzielGameActivity             > dist/native-am-start.txt 2>&1

          sleep 12
          "$ADB" logcat -d -v threadtime > dist/native-logcat.txt
          "$ADB" exec-out screencap -p > dist/native-first-frame.png || true

          PID="$("$ADB" shell pidof com.xziel.engineprototype 2>/dev/null | tr -d '\r' || true)"
          test -n "$PID"

          if grep -Eq "FATAL EXCEPTION|Fatal signal|ANR in com\.xziel\.engineprototype|>>> com\.xziel\.engineprototype <<<" dist/native-logcat.txt; then
            echo "Native prototype crashed or ANRed"
            grep -Ei "FATAL EXCEPTION|Fatal signal|ANR|XzielNative|com\.xziel\.engineprototype" dist/native-logcat.txt | tail -n 400
            exit 1
          fi

          grep -q "XZIEL_NATIVE_BOOT" dist/native-logcat.txt
          grep -q "XZIEL_VULKAN_READY" dist/native-logcat.txt
          echo "Native Xziel process remained alive and reached Vulkan-ready state."

      - name: Upload native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Engine-Vulkan-Prototype-runtime
          path: |
            dist/native-logcat.txt
            dist/native-first-frame.png
            dist/native-emulator-stdout.txt
            dist/native-am-start.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Engine-Vulkan-Prototype-debug
          path: dist/Xziel-Engine-Vulkan-Prototype-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK structure report
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Engine-Vulkan-Prototype-report
          path: xziel-native-apk-contents.txt
          if-no-files-found: error
          retention-days: 14
