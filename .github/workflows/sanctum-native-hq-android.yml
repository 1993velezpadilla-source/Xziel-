name: Sanctum Exterior Detail A-B Android

on:
  push:
    branches:
      - engine/mobile-power-fidelity-v1
      - engine/mobile-xzsm-mapped-load-v1
      - engine/mobile-material-dedup-v1
      - engine/mobile-draw-submission-telemetry-v1
      - engine/mobile-draw-group-telemetry-v1
      - engine/mobile-indirect-draw-v1
      - engine/mobile-cell-frustum-v1
      - engine/mobile-portal-visibility-v1
      - engine/mobile-range-frustum-v1
      - engine/mobile-gpu-pass-timing-v1
      - engine/mobile-gpu-pass-timing-mainline-v1
      - engine/mobile-world-vertex-precompute-v1
      - engine/mobile-front-to-back-earlyz-v1
      - engine/mobile-fragment-distance-lod-v1
      - engine/mobile-runtime-microbatch-cull-v1
      - engine/mobile-dynamic-resolution-v1
      - engine/mobile-pbr-materials-v1
      - engine/mobile-ktx2-astc-v1
      - engine/mobile-mip-streaming-v1
      - engine/mobile-upload-batching-v1
      - engine/mobile-mip-residency-vulkan-v1
      - engine/mobile-mip-residency-vulkan-v2
      - engine/mobile-async-streaming-v1
      - engine/mobile-world-streaming-v1
      - engine/mobile-world-streaming-cull-v1
      - engine/mobile-streaming-descriptor-frames-v1
      - engine/mobile-streaming-residency-registry-v1
      - engine/mobile-streaming-runtime-io-v1
      - engine/mobile-streaming-gpu-residency-v1
      - engine/mobile-streaming-mip-transition-v1
      - engine/mobile-streaming-geometry-index-v1
      - engine/mobile-streaming-geometry-residency-v1
      - engine/mobile-streaming-geometry-io-v2
      - engine/mobile-streaming-geometry-eviction-v1
      - engine/mobile-streaming-geometry-prefetch-v1
      - engine/mobile-streaming-geometry-budget-v1
    paths:
      - ".github/workflows/sanctum-native-hq-android.yml"
      - ".github/workflows/sanctum-clean-source.yml"
      - ".github/workflows/sanctum-astc-texture-pack.yml"
      - "tools/church_map/export_xziel_original_clean.py"
      - "tools/church_map/apply_exterior_microdetail.py"
      - "tools/texture_pack/**"
      - "engine/**"
      - "xziel-native-android/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctum-native-hq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sanctum-native-hq:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      # Frozen visual/gameplay payload. Engine-only commits consume this
      # validated source instead of re-running Blender's 2.82M-triangle export.
      # Bump only after a source workflow run passes visual + structural gates.
      SANCTUM_ASSET_SHA: "0f720e15c158da5d2061a2d4245075c54f501743"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Select validated Sanctum asset pack
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "engine/mobile-ktx2-astc-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-mip-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-upload-batching-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-mip-residency-vulkan-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-mip-residency-vulkan-v2" || ("${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-front-to-back-earlyz-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-fragment-distance-lod-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-runtime-microbatch-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-mainline-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-range-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-xzsm-mapped-load-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-material-dedup-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-submission-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-group-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-indirect-draw-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-cell-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-portal-visibility-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-v1") || "${GITHUB_REF_NAME}" == "engine/mobile-async-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-streaming-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-descriptor-frames-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-residency-registry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-runtime-io-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-gpu-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-mip-transition-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-index-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-io-v2" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-eviction-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-prefetch-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-budget-v1" ]]; then
            ASTC_PACK_BRANCH="${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" == "engine/mobile-upload-batching-v1" ]]; then
              ASTC_PACK_BRANCH="engine/mobile-ktx2-astc-v1"
            elif [[ "${GITHUB_REF_NAME}" == "engine/mobile-xzsm-mapped-load-v1" ]]; then
              ASTC_PACK_BRANCH="engine/mobile-power-fidelity-v1"
            elif [[ "${GITHUB_REF_NAME}" == "engine/mobile-material-dedup-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-submission-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-group-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-indirect-draw-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-cell-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-portal-visibility-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-range-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-mainline-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-front-to-back-earlyz-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-fragment-distance-lod-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-runtime-microbatch-cull-v1" ]]; then
              ASTC_PACK_BRANCH="engine/mobile-power-fidelity-v1"
            elif [[ "${GITHUB_REF_NAME}" == "engine/mobile-mip-residency-vulkan-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-mip-residency-vulkan-v2" || "${GITHUB_REF_NAME}" == "engine/mobile-async-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-streaming-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-descriptor-frames-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-residency-registry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-runtime-io-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-gpu-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-mip-transition-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-index-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-io-v2" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-eviction-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-prefetch-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-budget-v1" ]]; then
              ASTC_PACK_BRANCH="engine/mobile-power-fidelity-v1"
            fi
            for i in $(seq 1 120); do
              RESPONSE="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/sanctum-astc-texture-pack.yml/runs?branch=${ASTC_PACK_BRANCH}&status=success&per_page=20")"
              RUN_ID="$(jq -r '.workflow_runs[0].id // empty' <<<"${RESPONSE}")"

              if [[ -n "${RUN_ID}" && "${RUN_ID}" != "null" ]]; then
                echo "SANCTUM_ASSET_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
                echo "SANCTUM_ASSET_NAME=Xziel-Sanctum-Clean-Source-ASTC" >> "$GITHUB_ENV"
                echo "SANCTUM_ASSET_KIND=astc" >> "$GITHUB_ENV"
                echo "Using validated ASTC asset pack run ${RUN_ID}"
                exit 0
              fi

              echo "Waiting for first validated ASTC pack on ${GITHUB_REF_NAME}"
              sleep 20
            done

            echo "Timed out waiting for validated ASTC texture pack"
            exit 1
          fi

          for i in $(seq 1 120); do
            RESPONSE="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SANCTUM_ASSET_SHA}&per_page=20")"
            RUN_ID="$(jq -r '.workflow_runs[] | select(.name == "Sanctum Exterior Detail A-B Source") | .id' <<<"${RESPONSE}" | head -n 1)"

            if [[ -n "${RUN_ID}" && "${RUN_ID}" != "null" ]]; then
              STATUS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status')"
              CONCLUSION="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
              echo "Sanctum HQ asset run ${RUN_ID}: ${STATUS} ${CONCLUSION}"

              if [[ "${STATUS}" == "completed" ]]; then
                test "${CONCLUSION}" = "success"
                echo "SANCTUM_ASSET_RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
                echo "SANCTUM_ASSET_NAME=Xziel-Sanctum-Clean-Source" >> "$GITHUB_ENV"
                echo "SANCTUM_ASSET_KIND=png" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              echo "Waiting for asset run for ${SANCTUM_ASSET_SHA}"
            fi

            sleep 30
          done

          echo "Timed out waiting for Sanctum HQ asset export"
          exit 1

      - name: Download native HQ Sanctum assets
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACTS="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SANCTUM_ASSET_RUN_ID}/artifacts")"
          ARTIFACT_ID="$(jq -r --arg NAME "${SANCTUM_ASSET_NAME}" '.artifacts[] | select(.name == $NAME and .expired == false) | .id' <<<"${ARTIFACTS}" | head -n 1)"

          test -n "${ARTIFACT_ID}"
          test "${ARTIFACT_ID}" != "null"

          mkdir -p build/sanctum-artifact
          gh api             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             > build/sanctum-artifact.zip

          unzip -q build/sanctum-artifact.zip             -d build/sanctum-artifact

          MODEL="$(find build/sanctum-artifact             -path '*/xziel_native_static/models/xziel/sanctum/sanctum.xzsm'             -print -quit)"

          TEXTURE_DIR="$(find build/sanctum-artifact             -type d             -path '*/xziel_native_static/textures/xziel/sanctum'             -print -quit)"

          REPORT="$(find build/sanctum-artifact             -name 'xziel_native_static_mesh_report.json'             -print -quit)"

          NATIVE_MAP="$(find build/sanctum-artifact             -path '*/xziel_native_map/sanctum.xmap'             -print -quit)"

          NATIVE_MAP_REPORT="$(find build/sanctum-artifact             -path '*/xziel_native_map/sanctum_native_map_report.json'             -print -quit)"

          WEAPON_MODEL="$(find build/sanctum-artifact             -path '*/xziel_native_static/models/xziel/weapons/standard_rifle.xzsm'             -print -quit)"
          WEAPON_TEXTURE_DIR="$(find build/sanctum-artifact             -type d             -path '*/xziel_native_static/textures/xziel/weapons/standard_rifle'             -print -quit)"
          WEAPON_AUDIO_DIR="$(find build/sanctum-artifact             -type d             -path '*/xziel_native_static/audio/xziel/weapons'             -print -quit)"
          WEAPON_LICENSE="$(find build/sanctum-artifact             -path '*/xziel_native_static/licenses/standard_rifle_assets.txt'             -print -quit)"

          test -s "$MODEL"
          test -d "$TEXTURE_DIR"
          test -s "$REPORT"
          test -s "$NATIVE_MAP"
          test -s "$NATIVE_MAP_REPORT"
          test -s "$WEAPON_MODEL"
          test -d "$WEAPON_TEXTURE_DIR"
          test -d "$WEAPON_AUDIO_DIR"
          test -s "$WEAPON_LICENSE"

          jq '{
            coordinateSpace,
            sourceCollection,
            worldScale,
            sourceTriangles,
            runtimeTriangles,
            dressingTriangles,
            runtimeTotalTriangles,
            dynamicBarricadeObjectsExcluded,
            originalMaxTextureDimension,
            pbrLinkedMaterialCounts,
            spatialBatching,
            spatialBatchGridMeters,
            batchCount,
            maxTrianglesPerBatch,
            batchBoundsDiagonalMeanMeters,
            batchBoundsDiagonalMedianMeters,
            batchBoundsDiagonalMaxMeters,
            batchBoundsOver10m,
            batchBoundsOver20m,
            batchBoundsOver40m,
            totalVertices,
            totalIndices,
            textureCount,
            modelBytes,
            boundsMin,
            boundsMax
          }' "$REPORT" | tee build/sanctum-native-hq-report.json

          jq -e '.pipeline == "original_glb_direct"' "$REPORT"
          jq -e '.sourceUid == "b92917ff83914adc8bc93959ba8b4399"' "$REPORT"
          jq -e '.coordinateSpace == "native"' "$REPORT"
          jq -e '.sourceCollection == "DIRECT_ORIGINAL_GLB"' "$REPORT"
          jq -e '.version == 4' "$REPORT"
          jq -e '.vertexStrideBytes == 36' "$REPORT"
          jq -e '.sourceTriangles >= 2700000' "$REPORT"
          jq -e '.runtimeTriangles == .sourceTriangles' "$REPORT"

          if [[ "${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" ]]; then
            jq -e '.spatialBatching == "morton_grid_centroid_v1"' "$REPORT"
            jq -e '.spatialBatchGridMeters == 0.5' "$REPORT"
            jq -e '.batchCount == 333' "$REPORT"
            jq -e '.maxTrianglesPerBatch <= 9000' "$REPORT"
            jq -e '.totalIndices == (.runtimeTriangles * 3)' "$REPORT"
            jq -e '.totalVertices == 2406868' "$REPORT"
            jq -e '.batchBoundsDiagonalMeanMeters < 17.0' "$REPORT"
            jq -e '.batchBoundsDiagonalMedianMeters < 14.1' "$REPORT"
            jq -e '.batchBoundsDiagonalMaxMeters < 65.0' "$REPORT"
            jq -e '.batchBoundsOver40m <= 13' "$REPORT"
            echo "XZIEL_SPATIAL_BATCH_SOURCE_ACTIVE"
          fi

          jq -e '(.doubleSidedBatchCount + .backfaceCulledBatchCount) == .batchCount' "$REPORT"
          jq -e '.legacyPhotogrammetryDoubleSided == true' "$REPORT"
          jq -e '.doubleSidedBatchCount == .batchCount' "$REPORT"
          jq -e '.backfaceCulledBatchCount == 0' "$REPORT"
          jq -e '.dressingTriangles == 0' "$REPORT"
          jq -e '.decimateRatio == 1' "$REPORT"
          jq -e '.scanCleanup == "disabled"' "$REPORT"
          jq -e '.vertexLighting == "identity_white"' "$REPORT"
          jq -e '.textureSourceMode == "original_glb_embedded_pixels_plus_matched_exterior_microdetail"' "$REPORT"
          jq -e '.textureCount > 0' "$REPORT"
          jq -e '.microdetailApplied == true' "$REPORT"
          jq -e '.microdetailCandidate == "polyhaven_medieval_blocks_03"' "$REPORT"
          jq -e '.runtimeExteriorResolution == [4096,4096]' "$REPORT"
          jq -e '.exactSourcePixelTextures == (.textureCount - 1)' "$REPORT"
          jq -e '[.materialReport[] | select(.exactSourcePixels == false)] | length == 1' "$REPORT"

          jq '{
            schemaVersion,
            boxCount,
            floorCount,
            routeStepCount,
            doorCount,
            windowCount,
            zombieSpawnCount,
            playerSpawn,
            playerYawDegrees,
            arena,
            nativeFloorY,
            worldScale
          }' "$NATIVE_MAP_REPORT" | tee build/sanctum-native-map-report.json

          jq -e '.schemaVersion == 2' "$NATIVE_MAP_REPORT"
          jq -e '.boxCount >= 20' "$NATIVE_MAP_REPORT"
          jq -e '.floorCount >= 10' "$NATIVE_MAP_REPORT"
          jq -e '.routeStepCount > 0' "$NATIVE_MAP_REPORT"
          jq -e '.doorCount >= 7' "$NATIVE_MAP_REPORT"
          jq -e '.windowCount >= 8' "$NATIVE_MAP_REPORT"
          jq -e '.zombieSpawnCount >= 8' "$NATIVE_MAP_REPORT"

          mkdir -p             xziel-native-android/app/src/main/assets/models/xziel/sanctum             xziel-native-android/app/src/main/assets/textures/xziel/sanctum             xziel-native-android/app/src/main/assets/models/xziel/weapons             xziel-native-android/app/src/main/assets/textures/xziel/weapons/standard_rifle             xziel-native-android/app/src/main/assets/audio/xziel/weapons             xziel-native-android/app/src/main/assets/licenses             xziel-native-android/app/src/main/assets/maps

          cp "$MODEL"             xziel-native-android/app/src/main/assets/models/xziel/sanctum/sanctum.xzsm

          cp "$NATIVE_MAP"             xziel-native-android/app/src/main/assets/maps/sanctum.xmap

          cp -a "$TEXTURE_DIR"/.             xziel-native-android/app/src/main/assets/textures/xziel/sanctum/
          cp "$WEAPON_MODEL"             xziel-native-android/app/src/main/assets/models/xziel/weapons/standard_rifle.xzsm
          cp -a "$WEAPON_TEXTURE_DIR"/.             xziel-native-android/app/src/main/assets/textures/xziel/weapons/standard_rifle/
          cp -a "$WEAPON_AUDIO_DIR"/.             xziel-native-android/app/src/main/assets/audio/xziel/weapons/
          cp "$WEAPON_LICENSE"             xziel-native-android/app/src/main/assets/licenses/standard_rifle_assets.txt

          test -s             xziel-native-android/app/src/main/assets/models/xziel/sanctum/sanctum.xzsm

          TEXTURE_COUNT="$(find xziel-native-android/app/src/main/assets/textures/xziel/sanctum -type f -name '*.png' | wc -l)"
          KTX2_COUNT="$(find xziel-native-android/app/src/main/assets/textures -type f -name '*.ktx2' | wc -l)"

          test "${TEXTURE_COUNT}" -gt 0

          if [[ "${SANCTUM_ASSET_KIND}" == "astc" ]]; then
            test "${KTX2_COUNT}" -gt 0
            ASTC_REPORT="$(find build/sanctum-artifact -name 'xziel_astc_texture_report.json' -print -quit)"
            test -s "${ASTC_REPORT}"
            jq -e '.codec == "ASTC_LDR"' "${ASTC_REPORT}"
            jq -e '.pngCount == .ktx2Count and .ktx2Count > 0' "${ASTC_REPORT}"
            cp "${ASTC_REPORT}" build/xziel-astc-texture-report.json
          fi

          echo "Staged ${TEXTURE_COUNT} PNG fallback textures and ${KTX2_COUNT} KTX2 textures"
          du -sh             xziel-native-android/app/src/main/assets/models/xziel/sanctum             xziel-native-android/app/src/main/assets/textures/xziel/sanctum

      - name: Build and test native Xziel core
        shell: bash
        run: |
          set -euo pipefail
          cmake -S engine -B build/xziel-core \
            -DXZIEL_ENGINE_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/xziel-core --parallel 2
          ctest --test-dir build/xziel-core \
            --output-on-failure

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools"             -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36.1"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.22.1"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Compile native Vulkan shaders
        working-directory: xziel-native-android
        shell: bash
        run: |
          set -euo pipefail
          GLSLC="$(find             "${ANDROID_HOME}/ndk/28.2.13676358"             -type f -name glslc -perm -111 -print -quit)"
          test -n "$GLSLC"

          mkdir -p app/src/main/assets/shaders

          "$GLSLC" -O -fshader-stage=vert             app/src/main/shaders/xziel_first.vert             -o app/src/main/assets/shaders/xziel_first.vert.spv

          "$GLSLC" -O -fshader-stage=frag             app/src/main/shaders/xziel_first.frag             -o app/src/main/assets/shaders/xziel_first.frag.spv

          "$GLSLC" -O -fshader-stage=vert             app/src/main/shaders/xziel_static_mesh.vert             -o app/src/main/assets/shaders/xziel_static_mesh.vert.spv

          "$GLSLC" -O -fshader-stage=frag             app/src/main/shaders/xziel_static_mesh.frag             -o app/src/main/assets/shaders/xziel_static_mesh.frag.spv

          "$GLSLC" -O -fshader-stage=vert             app/src/main/shaders/xziel_scene_composite.vert             -o app/src/main/assets/shaders/xziel_scene_composite.vert.spv

          "$GLSLC" -O -fshader-stage=frag             app/src/main/shaders/xziel_scene_composite.frag             -o app/src/main/assets/shaders/xziel_scene_composite.frag.spv

          "$GLSLC" -O -fshader-stage=vert             app/src/main/shaders/xziel_ui.vert             -o app/src/main/assets/shaders/xziel_ui.vert.spv

          "$GLSLC" -O -fshader-stage=frag             app/src/main/shaders/xziel_ui.frag             -o app/src/main/assets/shaders/xziel_ui.frag.spv

      - name: Build Sanctum HQ Vulkan APK
        working-directory: xziel-native-android
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify HQ APK payload
        shell: bash
        run: |
          set -euo pipefail

          APK="xziel-native-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          unzip -l "$APK" | tee build/sanctum-hq-apk-contents.txt

          grep -q             "assets/models/xziel/sanctum/sanctum.xzsm"             build/sanctum-hq-apk-contents.txt

          grep -q             "assets/maps/sanctum.xmap"             build/sanctum-hq-apk-contents.txt

          grep -q             "assets/models/xziel/weapons/standard_rifle.xzsm"             build/sanctum-hq-apk-contents.txt

          python3 - "${APK}" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              entries = [
                  info for info in archive.infolist()
                  if info.filename.endswith(".xzsm")
              ]
              if not entries:
                  raise SystemExit("no XZSM assets in APK")
              compressed = [
                  info.filename for info in entries
                  if info.compress_type != zipfile.ZIP_STORED
              ]
              if compressed:
                  raise SystemExit(
                      "XZSM assets were ZIP-compressed: " +
                      ", ".join(compressed[:8])
                  )
              print(f"XZIEL_XZSM_APK_STORED count={len(entries)}")
          PY

          grep -q             "assets/textures/xziel/weapons/standard_rifle/.*\.png"             build/sanctum-hq-apk-contents.txt
          grep -q             "assets/audio/xziel/weapons/standard_rifle_fire.wav"             build/sanctum-hq-apk-contents.txt
          grep -q             "assets/audio/xziel/weapons/standard_rifle_reload.wav"             build/sanctum-hq-apk-contents.txt

          grep -q             "assets/textures/xziel/sanctum/.*\.png"             build/sanctum-hq-apk-contents.txt

          if [[ "${SANCTUM_ASSET_KIND}" == "astc" ]]; then
            grep -q             "assets/textures/xziel/sanctum/.*\.ktx2"             build/sanctum-hq-apk-contents.txt

            python3 - "${APK}" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              entries = [
                  info for info in archive.infolist()
                  if info.filename.endswith(".ktx2")
              ]
              if not entries:
                  raise SystemExit("no KTX2 assets in APK")
              compressed = [
                  info.filename for info in entries
                  if info.compress_type != zipfile.ZIP_STORED
              ]
              if compressed:
                  raise SystemExit(
                      "KTX2 assets were ZIP-compressed: " +
                      ", ".join(compressed[:8])
                  )
              print(f"XZIEL_KTX2_APK_STORED count={len(entries)}")
          PY
          fi

          grep -q             "assets/shaders/xziel_static_mesh.vert.spv"             build/sanctum-hq-apk-contents.txt

          grep -q             "assets/shaders/xziel_static_mesh.frag.spv"             build/sanctum-hq-apk-contents.txt

          grep -q             "assets/shaders/xziel_scene_composite.vert.spv"             build/sanctum-hq-apk-contents.txt
          grep -q             "assets/shaders/xziel_scene_composite.frag.spv"             build/sanctum-hq-apk-contents.txt

          # Shipping Sanctum is native Xziel only. The legacy NZP/Quake
          # harness may still exist as development evidence in other workflow
          # artifacts, but it must never leak into the Android game package.
          if grep -Eiq             'assets/.*(sanctum_harness|\.bsp($|[[:space:]])|/nzp/|/id1/|\.pak($|[[:space:]]))'             build/sanctum-hq-apk-contents.txt; then
            echo "ERROR: legacy Quake/NZP payload found in native Sanctum APK"
            grep -Ei             'assets/.*(sanctum_harness|\.bsp($|[[:space:]])|/nzp/|/id1/|\.pak($|[[:space:]]))'             build/sanctum-hq-apk-contents.txt || true
            exit 1
          fi
          echo "XZIEL_NATIVE_ONLY_PAYLOAD_OK"

          ZIPALIGN="${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          mkdir -p dist
          cp "$APK" dist/Xziel-Sanctum-Native-HQ-debug.apk
          ls -lh dist/Xziel-Sanctum-Native-HQ-debug.apk

      - name: Boot HQ Sanctum and verify native mesh takeover
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-sanctum-hq-avd
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_AVD_HOME" dist

          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find             "${ANDROID_HOME}/cmdline-tools"             -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd             --force             --name xziel-sanctum-hq             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR"             @xziel-sanctum-hq             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu software             -feature VulkanNativeSwapchain             -memory 4096             > dist/sanctum-hq-emulator.txt 2>&1 &

          timeout 150 "$ADB" wait-for-device

          BOOTED=0
          for i in $(seq 1 75); do
            if [[ "$("$ADB" shell getprop sys.boot_completed               2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          test "$BOOTED" = "1"

          APK="xziel-native-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ADB" install -r "$APK"

          if [[ ("${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-front-to-back-earlyz-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-fragment-distance-lod-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-runtime-microbatch-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-mainline-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-range-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-xzsm-mapped-load-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-material-dedup-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-submission-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-group-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-indirect-draw-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-cell-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-portal-visibility-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-v1") || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-gpu-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-mip-transition-v1" ]]; then
            "$ADB" shell setprop debug.xziel.streaming_probe 1
          fi

          if [[ ("${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-front-to-back-earlyz-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-fragment-distance-lod-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-runtime-microbatch-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-mainline-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-range-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-xzsm-mapped-load-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-material-dedup-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-submission-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-group-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-indirect-draw-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-cell-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-portal-visibility-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-v1") || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-eviction-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-prefetch-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-budget-v1" ]]; then
            "$ADB" shell setprop debug.xziel.geometry_streaming_probe 1
          fi

          "$ADB" logcat -c
          "$ADB" shell am force-stop             com.xziel.engineprototype || true

          # Android's immersive-mode education bubble covered the real in-game
          # screenshot on clean emulator boots. Pre-confirm it before launch,
          # then still keep a UIAutomator fallback below for API/image variants
          # that ignore the secure setting.
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true

          timeout 8 "$ADB" shell am start             -n com.xziel.engineprototype/.XzielGameActivity             > dist/sanctum-hq-am-start.txt 2>&1 || true

          # Do not inject any input while the HQ mesh/textures are still
          # uploading on the GameActivity thread. The old unconditional ENTER
          # fallback could create its own 5s input-dispatch ANR on a loaded CI
          # emulator even though the native runtime completed successfully.
          READY=0
          # ASTC is CPU-emulated under the CI software Vulkan stack and can
          # vary substantially with shared-runner load. Batching is gated
          # separately below; allow enough time to distinguish slow startup
          # from a real hang/crash.
          for i in $(seq 1 75); do
            STARTUP_LOG="$("$ADB" logcat -d -v brief -s XzielNative:I XzielVulkan:I XzielSanctumMesh:I '*:S' 2>/dev/null || true)"
            if grep -q "XZIEL_VULKAN_READY" <<<"$STARTUP_LOG" && \
               grep -q "XZIEL_SANCTUM_MESH_READY" <<<"$STARTUP_LOG"; then
              READY=1
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            # Close the poll/sleep race: a loaded software Vulkan emulator can
            # publish both readiness markers immediately after the final
            # one-second poll. Take one authoritative snapshot before failing.
            FINAL_STARTUP_LOG="$("$ADB" logcat -d -v brief -s XzielNative:I XzielVulkan:I XzielSanctumMesh:I '*:S' 2>/dev/null || true)"
            if grep -q "XZIEL_VULKAN_READY" <<<"$FINAL_STARTUP_LOG" && \
               grep -q "XZIEL_SANCTUM_MESH_READY" <<<"$FINAL_STARTUP_LOG"; then
              READY=1
              echo "XZIEL_STARTUP_READY_FINAL_PROBE"
            fi
          fi

          if [[ "$READY" != "1" ]]; then
            timeout 8 "$ADB" logcat -d -v threadtime > dist/sanctum-hq-logcat.txt || true
            echo "ERROR: startup readiness timed out before Vulkan + Sanctum mesh markers"
            grep -E "XZIEL_|VUID|VK_ERROR|Fatal signal|ANR|device lost|failed" dist/sanctum-hq-logcat.txt | tail -n 300 || true
            exit 1
          fi

          # Preserve the authoritative startup window before noisy emulator
          # services can rotate early Xziel markers out of logcat. Runtime
          # validation later merges this snapshot with the post-tour capture.
          timeout 8 "$ADB" logcat -d -v threadtime \
            > dist/sanctum-hq-startup-logcat.txt || true

          timeout 8 "$ADB" shell uiautomator dump /sdcard/xziel-sanctum-window.xml             >/dev/null 2>&1 || true
          timeout 8 "$ADB" exec-out cat /sdcard/xziel-sanctum-window.xml             > dist/sanctum-hq-window.xml 2>/dev/null || true

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          source = Path("dist/sanctum-hq-window.xml")
          target = Path("dist/sanctum-hq-dismiss-tap.txt")
          target.unlink(missing_ok=True)

          if source.exists() and source.stat().st_size:
              try:
                  root = ET.fromstring(source.read_text(errors="ignore"))
                  for node in root.iter():
                      text = (node.attrib.get("text") or "").strip().lower()
                      desc = (node.attrib.get("content-desc") or "").strip().lower()
                      if text in {"got it", "ok"} or desc in {"got it", "ok"}:
                          bounds = node.attrib.get("bounds", "")
                          match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                          if match:
                              x1, y1, x2, y2 = map(int, match.groups())
                              target.write_text(f"{(x1+x2)//2} {(y1+y2)//2}\n")
                              break
              except ET.ParseError:
                  pass
          PY

          if [[ -s dist/sanctum-hq-dismiss-tap.txt ]]; then
            read -r DISMISS_X DISMISS_Y < dist/sanctum-hq-dismiss-tap.txt
            "$ADB" shell input tap "$DISMISS_X" "$DISMISS_Y" || true
          fi

          # Readiness above already proves the heavy synchronous startup phase
          # is complete. Give presentation a short settling window before the
          # screenshot/touch tour instead of a blind 16-second delay.
          sleep 4

          timeout 8 "$ADB" logcat -d -v threadtime             > dist/sanctum-hq-logcat.txt || true

          capture_png() {
            local target="$1"
            local remote="/sdcard/$(basename "$target")"

            for attempt in 1 2 3; do
              rm -f "$target"

              timeout 12 "$ADB" shell screencap -p "$remote"                 >/dev/null 2>&1 || true
              timeout 12 "$ADB" pull "$remote" "$target"                 >/dev/null 2>&1 || true

              if python3 - "$target" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if not path.exists() or path.stat().st_size < 16384:
              raise SystemExit(1)

          data = path.read_bytes()
          png_signature = b"\x89PNG\r\n\x1a\n"
          png_iend = b"\x00\x00\x00\x00IEND\xaeB\x60\x82"
          if not data.startswith(png_signature) or not data.endswith(png_iend):
              raise SystemExit(1)
          PY
              then
                "$ADB" shell rm -f "$remote" >/dev/null 2>&1 || true
                return 0
              fi

              echo "Retrying incomplete screenshot $target (attempt $attempt)" >&2
              sleep 1
            done

            echo "Failed to capture a complete PNG: $target" >&2
            return 1
          }

          # Keep the legacy filename for downstream checks, but now require a
          # complete PNG rather than accepting an adb stream killed mid-IEND.
          capture_png dist/sanctum-hq-first-frame.png
          cp dist/sanctum-hq-first-frame.png             dist/sanctum-hq-tour-01-entry.png

          # CI-only touch tour. Pixel 6 AVD is 2400x1080 landscape here.
          # Right side is free-look; left side is the movement joystick.
          "$ADB" shell input swipe 1700 330 1180 330 700 || true
          sleep 1
          capture_png dist/sanctum-hq-tour-02-look.png

          "$ADB" shell input swipe 420 840 420 560 1800 || true
          sleep 1
          capture_png dist/sanctum-hq-tour-03-forward.png

          "$ADB" shell input swipe 1500 360 1880 250 650 || true
          sleep 1
          capture_png dist/sanctum-hq-tour-04-look-up.png

          # Refresh diagnostics after the tour so delayed frame-pacing,
          # first GPU timing, ADPF and swapchain-stability markers are kept.
          timeout 8 "$ADB" logcat -d -v threadtime             > dist/sanctum-hq-logcat.txt || true

          # Software-Vulkan CI can emit enough unrelated system/audio traffic
          # to evict startup markers from the bounded logcat ring before the
          # tour ends. Merge the preserved startup snapshot with the final
          # capture and de-duplicate exact repeated lines. This keeps the gate
          # strict without treating log rotation as an engine regression.
          if [[ -s dist/sanctum-hq-startup-logcat.txt ]]; then
            cat dist/sanctum-hq-startup-logcat.txt \
                dist/sanctum-hq-logcat.txt \
              | awk '!seen[$0]++' \
              > dist/sanctum-hq-logcat-merged.txt
            mv dist/sanctum-hq-logcat-merged.txt \
              dist/sanctum-hq-logcat.txt
          fi

          PID="$(timeout 5 "$ADB" shell pidof             com.xziel.engineprototype 2>/dev/null             | tr -d '\r' || true)"

          test -n "$PID"

          if grep -Eq             "FATAL EXCEPTION|Fatal signal|ANR in com\.xziel\.engineprototype|>>> com\.xziel\.engineprototype <<<"             dist/sanctum-hq-logcat.txt; then
            echo "Sanctum HQ native runtime crashed or ANRed"
            exit 1
          fi

          grep -q "XZIEL_NATIVE_BOOT"             dist/sanctum-hq-logcat.txt

          grep -q "XZIEL_VULKAN_READY"             dist/sanctum-hq-logcat.txt

          grep -q "XZIEL_VULKAN_SURFACE_ROTATION"             dist/sanctum-hq-logcat.txt
          grep -q "XZIEL_GPU_CAPS"             dist/sanctum-hq-logcat.txt

          if [[ "${SANCTUM_ASSET_KIND}" == "astc" ]]; then
            if grep -Eq "XZIEL_GPU_CAPS .*astc=1" dist/sanctum-hq-logcat.txt; then
              KTX_LOAD_COUNT="$(grep -c "XZIEL_KTX2_ASTC_TEXTURE" dist/sanctum-hq-logcat.txt || true)"
              test "${KTX_LOAD_COUNT}" -gt 0

              if grep -q "ASTC KTX2 texture exists but failed validation/upload" dist/sanctum-hq-logcat.txt; then
                echo "ERROR: ASTC-capable runtime fell back after KTX2 upload failure"
                exit 1
              fi

              grep -q "XZIEL_STATIC_TEXTURE_CAPS .*texture_budget_mb=" dist/sanctum-hq-logcat.txt

              DEGRADED_COUNT="$(grep -Ec "XZIEL_KTX2_ASTC_TEXTURE .*base_mip=[1-9]" dist/sanctum-hq-logcat.txt || true)"
              if [[ "${GITHUB_REF_NAME}" == "engine/mobile-mip-residency-vulkan-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-mip-residency-vulkan-v2" ]]; then
                test "${DEGRADED_COUNT}" -eq 0
                BASE_ZERO_COUNT="$(grep -Ec "XZIEL_KTX2_ASTC_TEXTURE .*base_mip=0 " dist/sanctum-hq-logcat.txt || true)"
                test "${BASE_ZERO_COUNT}" -eq "${KTX_LOAD_COUNT}"
                echo "XZIEL_MIP_RESIDENCY_FULL_RES textures=${BASE_ZERO_COUNT}"
              fi

              echo "XZIEL_ASTC_RUNTIME_ACTIVE textures=${KTX_LOAD_COUNT}"

              if [[ ("${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-front-to-back-earlyz-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-fragment-distance-lod-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-runtime-microbatch-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-mainline-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-range-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-xzsm-mapped-load-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-material-dedup-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-submission-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-draw-group-telemetry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-indirect-draw-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-cell-frustum-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-portal-visibility-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-v1") || "${GITHUB_REF_NAME}" == "engine/mobile-async-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-streaming-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-streaming-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-descriptor-frames-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-residency-registry-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-runtime-io-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-gpu-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-mip-transition-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-index-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-residency-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-io-v2" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-eviction-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-prefetch-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-streaming-geometry-budget-v1" ]]; then
                grep -Eq "XZIEL_ASYNC_ASTC_PREFETCH_READY .*queued=[1-9][0-9]*" dist/sanctum-hq-logcat.txt
                grep -Eq "XZIEL_ASYNC_ASTC_PREFETCH_DONE .*failed=0 .*pending=0" dist/sanctum-hq-logcat.txt

                ASYNC_QUEUED="$(grep "XZIEL_ASYNC_ASTC_PREFETCH_DONE" dist/sanctum-hq-logcat.txt | sed -n 's/.* queued=\([0-9][0-9]*\).*/\1/p' | awk '{s+=$1} END {print s+0}')"
                ASYNC_CONSUMED="$(grep "XZIEL_ASYNC_ASTC_PREFETCH_DONE" dist/sanctum-hq-logcat.txt | sed -n 's/.* consumed=\([0-9][0-9]*\).*/\1/p' | awk '{s+=$1} END {print s+0}')"
                test "${ASYNC_QUEUED}" -gt 0
                test "${ASYNC_CONSUMED}" -eq "${ASYNC_QUEUED}"
                echo "XZIEL_ASYNC_ASTC_PREFETCH_ACTIVE queued=${ASYNC_QUEUED} consumed=${ASYNC_CONSUMED}"
              fi

              if grep -Eq "XZIEL_STATIC_TEXTURE_CAPS .*upload_batch_commands=2" dist/sanctum-hq-logcat.txt; then
                grep -Eq "XZIEL_TEXTURE_UPLOAD_BATCH commands=2 limit=2" dist/sanctum-hq-logcat.txt
                BATCH_COUNT="$(grep -c "XZIEL_TEXTURE_UPLOAD_BATCH" dist/sanctum-hq-logcat.txt || true)"
                echo "XZIEL_TEXTURE_UPLOAD_BATCH_ACTIVE batches=${BATCH_COUNT}"
              fi
            else
              echo "XZIEL_ASTC_RUNTIME_FALLBACK device_has_no_astc"
            fi
          fi
          grep -Eq "XZIEL_GPU_TIMESTAMPS_(READY|UNAVAILABLE)"             dist/sanctum-hq-logcat.txt

          if [[ "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-gpu-pass-timing-mainline-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-front-to-back-earlyz-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-fragment-distance-lod-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-runtime-microbatch-cull-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" ]]; then
            grep -q "XZIEL_GPU_PASS_TIMING_READY passes=3 queries_per_frame=4" dist/sanctum-hq-logcat.txt
            grep -Eq "XZIEL_PERF_TIMING .*gpu_frame_ms=[0-9]+\.[0-9]+ .*gpu_preworld_ms=[0-9]+\.[0-9]+ .*gpu_world_ms=[0-9]+\.[0-9]+ .*gpu_composite_ui_ms=[0-9]+\.[0-9]+" dist/sanctum-hq-logcat.txt

            GPU_FRAME_MS="$(grep "XZIEL_PERF_TIMING" dist/sanctum-hq-logcat.txt | tail -n 1 | sed -n 's/.* gpu_frame_ms=\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
            GPU_PREWORLD_MS="$(grep "XZIEL_PERF_TIMING" dist/sanctum-hq-logcat.txt | tail -n 1 | sed -n 's/.* gpu_preworld_ms=\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
            GPU_WORLD_MS="$(grep "XZIEL_PERF_TIMING" dist/sanctum-hq-logcat.txt | tail -n 1 | sed -n 's/.* gpu_world_ms=\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
            GPU_COMPOSITE_UI_MS="$(grep "XZIEL_PERF_TIMING" dist/sanctum-hq-logcat.txt | tail -n 1 | sed -n 's/.* gpu_composite_ui_ms=\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"

            test -n "${GPU_FRAME_MS}"
            test -n "${GPU_PREWORLD_MS}"
            test -n "${GPU_WORLD_MS}"
            test -n "${GPU_COMPOSITE_UI_MS}"

            echo "XZIEL_GPU_PASS_TIMING_ACTIVE frame_ms=${GPU_FRAME_MS} preworld_ms=${GPU_PREWORLD_MS} world_ms=${GPU_WORLD_MS} composite_ui_ms=${GPU_COMPOSITE_UI_MS}"
          fi

          if [[ "${GITHUB_REF_NAME}" == "engine/mobile-world-vertex-precompute-v1" || "${GITHUB_REF_NAME}" == "engine/mobile-power-fidelity-v1" ]]; then
            grep -q "XZIEL_VERTEX_TRANSFORM_PRECOMPUTE_READY" dist/sanctum-hq-logcat.txt
            echo "XZIEL_VERTEX_TRANSFORM_PRECOMPUTE_ACTIVE"
          fi

          grep -q "XZIEL_TRANSIENT_DEPTH_"             dist/sanctum-hq-logcat.txt
          grep -q "XZIEL_SCENE_COMPOSITE_READY"             dist/sanctum-hq-logcat.txt
          grep -Eq "XZIEL_DYNAMIC_RESOLUTION scale=0\.(70|82|92) scene=[0-9]+x[0-9]+ native=[0-9]+x[0-9]+"             dist/sanctum-hq-logcat.txt
