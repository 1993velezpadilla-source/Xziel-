name: Hayuya Monster CI

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - tools/hayuya3d/**
      - assets/characters/shared/docs/HAYUYA_3D_MASTER_PROMPT.md
      - .github/workflows/hayuya-monster-ci.yml

permissions:
  contents: read

jobs:
  planner-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU Hayuya test deps
        run: python -m pip install --upgrade pip numpy pillow trimesh scipy fast-simplification

      - name: Compile Hayuya Python
        run: python -m py_compile tools/hayuya3d/*.py

      - name: Run Hayuya unit tests
        run: python -m unittest discover -s tools/hayuya3d/tests -v

      - name: Measure source-fidelity score on known-good Zombie Iglesia
        run: |
          python tools/hayuya3d/visual_judge.py \
            hayuya/models/zombie-iglesia-001/model.glb \
            --source hayuya/models/zombie-iglesia/prepared_views/front.png \
            --size 128 \
            --azimuth-step 45 | tee /tmp/hayuya-known-good-visual.json

      - name: Dry-run one-photo planner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/hayuya-front.png")
          p.write_bytes(b"\x89PNG\r\n\x1a\n" + b"x"*2048)
          PY
          python tools/hayuya3d/hayuya.py \
            --input /tmp/hayuya-front.png \
            --profile monster \
            --gpu-vram 8

      - name: Dry-run twelve-photo folder reference pool
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("/tmp/hayuya-pool")
          (root/"individual").mkdir(parents=True, exist_ok=True)
          (root/"details").mkdir(parents=True, exist_ok=True)
          for i in range(9):
              p=root/"individual"/f"view-{i}.png"
              p.write_bytes(b"\x89PNG\r\n\x1a\n" + bytes([65+i])*(2048+i))
          for i in range(3):
              p=root/"details"/f"detail-{i}.png"
              p.write_bytes(b"\x89PNG\r\n\x1a\n" + bytes([80+i])*(2200+i))
          PY
          python tools/hayuya3d/hayuya.py \
            --input-dir /tmp/hayuya-pool \
            --profile monster \
            --gpu-vram 8
