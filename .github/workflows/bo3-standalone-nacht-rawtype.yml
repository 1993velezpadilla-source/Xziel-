name: BO3 Standalone Nacht Raw Type Audit

on:
  push:
    branches:
      - experiment/bo3-nacht-workshop-audit
    paths:
      - ".github/workflows/bo3-standalone-nacht-rawtype.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Download standalone Nacht package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'steamcmd.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'steamcmd.zip') -DestinationPath $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item 311210 782262486 validate +quit
          $rc=$LASTEXITCODE; $global:LASTEXITCODE=0
          $root=Get-ChildItem -Path $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*steamapps\workshop\content\311210\782262486' } | Select-Object -First 1
          if (-not $root) { throw "Workshop missing rc=$rc" }
          $ff=Join-Path $root.FullName 'zm_return_to_nacht_der_untoten.ff'
          if (-not (Test-Path $ff)) { throw 'Map FastFile missing' }
          "MAP_ROOT=$($root.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MAP_FF=$ff" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $ff | Format-List FullName,Length
          exit 0

      - name: Install ACTS
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/ate47/atian-cod-tools/releases/download/3.3.0/acts.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'acts.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'acts.zip') -DestinationPath (Join-Path $env:RUNNER_TEMP 'acts') -Force
          $exe=Get-ChildItem (Join-Path $env:RUNNER_TEMP 'acts') -Filter acts.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'acts.exe missing' }
          "ACTS_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Decompress map FastFile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path map-type-audit | Out-Null
          Push-Location map-type-audit
          & $env:ACTS_EXE -d --disableScriptsDecomp fastfile -r gsc $env:MAP_FF
          $rc=$LASTEXITCODE; $global:LASTEXITCODE=0
          Pop-Location
          Write-Host "ACTS rc=$rc"
          $dec=Get-ChildItem map-type-audit -Filter '*.ff.dec' -Recurse | Select-Object -First 1
          if (-not $dec) { throw 'No decompressed map FastFile' }
          "DEC_FF=$($dec.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "DEC=$($dec.FullName) bytes=$($dec.Length)"
          exit 0

      - name: Parse BO3 XAssetList
        shell: pwsh
        run: |
          @'
          import collections,json,os,pathlib,struct
          N={0:'PHYSPRESET',1:'PHYSCONSTRAINTS',2:'DESTRUCTIBLEDEF',3:'XANIM',4:'XMODEL',5:'XMODELMESH',6:'MATERIAL',7:'COMPUTESHADERSET',8:'TECHSET',9:'IMAGE',10:'SOUND',11:'SOUND_PATCH',12:'COL_MAP',13:'COM_MAP',14:'GAME_MAP',15:'MAP_ENTS',16:'GFX_MAP',17:'LIGHTDEF',18:'LENSFLAREDEF',19:'UI_MAP',20:'FONT',21:'FONTICON',22:'LOCALIZE',23:'WEAPON',24:'WEAPONDEF',25:'WEAPONVARIANT',26:'WEAPONFULL',37:'SNDDRIVERGLOBALS',38:'FX',43:'PLAYER_CHARACTER',44:'AITYPE',45:'CHARACTER',46:'XMODELALIAS',47:'RAWFILE',48:'STRINGTABLE',49:'STRUCTUREDTABLE',51:'DDL',53:'TEXTURELIST',54:'SCRIPTPARSETREE',55:'KEYVALUEPAIRS',57:'ADDON_MAP_ENTS',65:'ZBARRIER',69:'SCRIPTBUNDLE',70:'SCRIPTBUNDLELIST',75:'ANIMSELECTORTABLE',76:'ANIMMAPPINGTABLE',77:'ANIMSTATEMACHINE',78:'BEHAVIORTREE',79:'BEHAVIORSTATEMACHINE',81:'SANIM',82:'LIGHTDESCRIPTION',84:'XCAM',85:'BGCACHE',86:'TEXTURECOMBO',90:'MAPTABLE',91:'MAPTABLELOADINGIMAGES',96:'UMBRA_TOME',97:'NAVMESH',98:'NAVVOLUME',102:'STREAMERHINT'}
          SPF_NEXT=2<<61
          def al(v,a): return (v+a-1)&~(a-1)
          p=pathlib.Path(os.environ['DEC_FF']); d=p.read_bytes()
          sc=struct.unpack_from('<i',d,0)[0]; sp=struct.unpack_from('<Q',d,8)[0]
          unk10=struct.unpack_from('<I',d,16)[0]; unk18=struct.unpack_from('<Q',d,24)[0]
          ac=struct.unpack_from('<i',d,32)[0]; ap=struct.unpack_from('<Q',d,40)[0]
          if not (0<=sc<10000000 and 0<=ac<10000000): raise SystemExit(f'bad header sc={sc} ac={ac}')
          pos=0x30; strings=[]
          ptrs=list(struct.unpack_from('<'+'Q'*sc,d,pos)) if sp and sc else []; pos+=8*sc if sp else 0
          for ptr in ptrs:
            if ptr & SPF_NEXT:
              e=d.find(b'\0',pos)
              if e<0: raise SystemExit('bad string')
              strings.append(d[pos:e].decode('utf-8','replace')); pos=e+1
            else: strings.append('')
          pos=al(pos,8)
          if pos+ac*16>len(d): raise SystemExit(f'asset table OOB pos={pos} ac={ac} len={len(d)}')
          c=collections.Counter()
          for i in range(ac): c[d[pos+i*16]]+=1
          report={
            'fastfile':os.path.basename(os.environ['MAP_FF']),
            'decompressed_bytes':len(d),'strings_count':sc,'asset_count':ac,'unk10':unk10,'unk18':hex(unk18),
            'counts_by_name':{N.get(k,f'UNKNOWN_{k}'):v for k,v in sorted(c.items())},
            'map_authority':{N[k]:c.get(k,0) for k in [12,13,14,15,16,57,96,97,98]},
            'content':{N[k]:c.get(k,0) for k in [3,4,5,6,9,10,23,38,43,44,45,54,65,84]},
            'string_samples':[s for s in strings if s][:300]
          }
          pathlib.Path('map-type-audit/report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2)[:50000])
          '@ | Set-Content map-type-audit/parse.py -Encoding utf8
          python map-type-audit/parse.py

      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: bo3-standalone-nacht-rawtype-report
          path: map-type-audit/report.json
          retention-days: 7