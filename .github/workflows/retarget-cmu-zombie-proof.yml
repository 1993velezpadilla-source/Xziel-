name: Retarget CMU Walks To Official NZP Zombie

on:
  workflow_dispatch:
  push:
    branches:
      - feature/zombie-mocap-library-v1
    paths:
      - ".github/workflows/retarget-cmu-zombie-proof.yml"
      - "scripts/blender_retarget_cmu_to_nzp.py"

permissions:
  contents: write

concurrency:
  group: zombie-retarget-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retarget:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zombie_walk_104_41
            file: assets/animations/zombie_mocap/cmu/walk/zombie_walk__104_41.fbx
          - name: zombie_march_20_08
            file: assets/animations/zombie_mocap/cmu/walk/zombie_march_A__20_08.fbx
          - name: limp_105_16
            file: assets/animations/zombie_mocap/cmu/walk/limp__105_16.fbx

    steps:
      - uses: actions/checkout@v5

      - name: Install Blender and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy cmake ninja-build build-essential

      - name: Download pinned official NZP zombie source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stock-zombie
          BASE="https://raw.githubusercontent.com/nzp-team/assets/c8135a66e00bb64577912fbf792f8fef7f47658e/source/models/ai/zfull"
          curl -fL --retry 5 "$BASE/mesh.blend" -o stock-zombie/mesh.blend
          for n in 0 1 2 3; do
            curl -fL --retry 5 "$BASE/texture_${n}.png" -o "stock-zombie/texture_${n}.png"
          done

      - name: Build pinned quake-export
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/cmdrf/quake-export.git /tmp/quake-export
          git -C /tmp/quake-export checkout 13711f953cbe20132b36b863974f6a6c495aec61
          git -C /tmp/quake-export submodule update --init --recursive
          cmake -S /tmp/quake-export -B /tmp/quake-export/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/quake-export/build --target quake-mdl-export quake-mdl-info

      - name: Retarget ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/cmu-retarget/${{ matrix.name }}"
          blender -b stock-zombie/mesh.blend             --python scripts/blender_retarget_cmu_to_nzp.py --             --mocap "${{ matrix.file }}"             --name "${{ matrix.name }}"             --skin-dir stock-zombie             --output "$OUT"
          test -s "$OUT/retarget_report.json"
          test -s "$OUT/body.json"
          test "$(find "$OUT/frames/body" -name '*.obj' | wc -l)" -eq 211

      - name: Validate stable MDL topology
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/cmu-retarget/${{ matrix.name }}"
          for part in body head larm rarm full; do
            python3 scripts/validate_zombie_obj_sequence.py "$OUT/frames/${part}" --frames 211
          done

      - name: Build segmented runtime MDLs
        shell: bash
        run: |
          set -euo pipefail
          OUT="build/cmu-retarget/${{ matrix.name }}"
          cd "$OUT"
          for part in body head larm rarm full; do
            /tmp/quake-export/build/mdl-export/quake-mdl-export "${part}.json" "${{ matrix.name }}_${part}.mdl"
            /tmp/quake-export/build/mdl-info/quake-mdl-info "${{ matrix.name }}_${part}.mdl" | tee "${part}-mdl-info.txt"
            test -s "${{ matrix.name }}_${part}.mdl"
          done

      - name: Upload retarget proof
        uses: actions/upload-artifact@v4
        with:
          name: cmu-retarget-${{ matrix.name }}
          path: |
            build/cmu-retarget/${{ matrix.name }}/*.mdl
            build/cmu-retarget/${{ matrix.name }}/*-mdl-info.txt
            build/cmu-retarget/${{ matrix.name }}/retarget_report.json
            build/cmu-retarget/${{ matrix.name }}/${{ matrix.name }}.blend
          retention-days: 14


  publish:
    needs: retarget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download validated retarget artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cmu-retarget-*
          path: /tmp/cmu-retarget-artifacts

      - name: Stage runtime zombie variants
        shell: bash
        run: |
          set -euo pipefail
          DEST="assets/runtime/zombie_variants"
          MODELS="$DEST/models/ai/xziel_zombies"
          META="$DEST/metadata"
          rm -rf "$DEST/models" "$META"
          mkdir -p "$MODELS" "$META"

          cat > "$DEST/manifest.tsv" <<'EOF'
          variant_id	clip_id	label	body	head	larm	rarm	full
          z10441	104_41	zombie_walk	models/ai/xziel_zombies/z10441b.mdl	models/ai/xziel_zombies/z10441h.mdl	models/ai/xziel_zombies/z10441l.mdl	models/ai/xziel_zombies/z10441r.mdl	models/ai/xziel_zombies/z10441f.mdl
          z2008	20_08	zombie_march	models/ai/xziel_zombies/z2008b.mdl	models/ai/xziel_zombies/z2008h.mdl	models/ai/xziel_zombies/z2008l.mdl	models/ai/xziel_zombies/z2008r.mdl	models/ai/xziel_zombies/z2008f.mdl
          z10516	105_16	limp	models/ai/xziel_zombies/z10516b.mdl	models/ai/xziel_zombies/z10516h.mdl	models/ai/xziel_zombies/z10516l.mdl	models/ai/xziel_zombies/z10516r.mdl	models/ai/xziel_zombies/z10516f.mdl
          EOF
          sed -i 's/^          //' "$DEST/manifest.tsv"

          stage_variant() {
            local artifact="$1"
            local source_name="$2"
            local id="$3"
            local dir="/tmp/cmu-retarget-artifacts/$artifact"
            test -d "$dir"
            cp "$dir/${source_name}_body.mdl" "$MODELS/${id}b.mdl"
            cp "$dir/${source_name}_head.mdl" "$MODELS/${id}h.mdl"
            cp "$dir/${source_name}_larm.mdl" "$MODELS/${id}l.mdl"
            cp "$dir/${source_name}_rarm.mdl" "$MODELS/${id}r.mdl"
            cp "$dir/${source_name}_full.mdl" "$MODELS/${id}f.mdl"
            cp "$dir/retarget_report.json" "$META/${id}.json"
          }

          stage_variant cmu-retarget-zombie_walk_104_41 zombie_walk_104_41 z10441
          stage_variant cmu-retarget-zombie_march_20_08 zombie_march_20_08 z2008
          stage_variant cmu-retarget-limp_105_16 limp_105_16 z10516

          find "$MODELS" -type f -name '*.mdl' -size 0 -print -quit | grep -q . && exit 1 || true
          test "$(find "$MODELS" -type f -name '*.mdl' | wc -l)" -eq 15
          du -h "$MODELS"/*.mdl

      - name: Commit validated runtime variants
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/zombie_variants
          if git diff --cached --quiet; then
            echo "Runtime variants already current."
            exit 0
          fi
          git commit -m "assets: publish validated CMU zombie runtime variants"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
