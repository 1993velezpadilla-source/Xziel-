name: Pavlov BO3 Nacht Map Actor Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-map-actor-audit.yml"

jobs:
  parse-map:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install SteamCMD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true

      - name: Download Pavlov BO3 Nacht workshop payload
        run: |
          set +e
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +login anonymous +workshop_download_item 555160 2755515831 validate +quit 2>&1 | tee "$RUNNER_TEMP/steamcmd.log"
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d -path '*/steamapps/workshop/content/555160/2755515831' -print -quit 2>/dev/null)
          if [ -z "$ROOT" ]; then echo 'Workshop payload missing'; exit 1; fi
          test -f "$ROOT/WindowsNoEditor.pak" || exit 1
          echo "PAK_ROOT=$ROOT" >> "$GITHUB_ENV"
          exit 0

      - name: Build CUE4Parse map inspector
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cue4map"
          cd "$RUNNER_TEMP/cue4map"
          dotnet new console --framework net8.0 --force
          dotnet add package CUE4Parse
          dotnet add package Newtonsoft.Json
          cat > Program.cs <<'CS'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using CUE4Parse.UE4.Objects.UObject;
          using Newtonsoft.Json;
          using Newtonsoft.Json.Linq;

          if (args.Length < 2) {
              Console.Error.WriteLine("usage: cue4map <pakdir> <out.json>");
              return 2;
          }

          var pakDir = args[0];
          var outPath = args[1];
          var provider = new DefaultFileProvider(pakDir, SearchOption.TopDirectoryOnly, true, new VersionContainer(EGame.GAME_UE4_21));
          provider.Initialize();

          var packagePath = "Pavlov/Content/CustomMaps/UGC2755515831/Nacht_de_Untoten.umap";
          var package = provider.LoadPackage(packagePath);
          var exports = package.GetExports();

          var rows = new List<object>();
          foreach (var exp in exports) {
              string cls = exp.ExportType;
              string name = exp.Name;
              string raw;
              try { raw = JsonConvert.SerializeObject(exp, Formatting.None, new JsonSerializerSettings { ReferenceLoopHandling = ReferenceLoopHandling.Ignore }); }
              catch (Exception e) { raw = "{\"serialization_error\":\"" + e.Message.Replace("\"","'") + "\"}"; }

              string? staticMesh = null;
              object? relativeLocation = null;
              object? relativeRotation = null;
              object? relativeScale3D = null;
              object? actorLocation = null;
              object? actorRotation = null;

              try {
                  var j = JObject.Parse(raw);
                  staticMesh = FindString(j, "StaticMesh");
                  relativeLocation = FindToken(j, "RelativeLocation");
                  relativeRotation = FindToken(j, "RelativeRotation");
                  relativeScale3D = FindToken(j, "RelativeScale3D");
                  actorLocation = FindToken(j, "ActorLocation");
                  actorRotation = FindToken(j, "ActorRotation");
              } catch {}

              if (cls.Contains("StaticMesh", StringComparison.OrdinalIgnoreCase) ||
                  cls.Contains("Actor", StringComparison.OrdinalIgnoreCase) ||
                  staticMesh != null || relativeLocation != null || actorLocation != null) {
                  rows.Add(new {
                      name, cls, staticMesh, relativeLocation, relativeRotation, relativeScale3D, actorLocation, actorRotation
                  });
              }
          }

          var result = new {
              engine = "UE4.21",
              packagePath,
              exportCount = exports.Count,
              selectedCount = rows.Count,
              rows
          };
          File.WriteAllText(outPath, JsonConvert.SerializeObject(result, Formatting.Indented));
          Console.WriteLine(JsonConvert.SerializeObject(new { result.engine, result.packagePath, result.exportCount, result.selectedCount }, Formatting.Indented));
          return 0;

          static JToken? FindToken(JToken root, string key) {
              foreach (var p in root.DescendantsAndSelf().OfType<JProperty>())
                  if (p.Name.Equals(key, StringComparison.OrdinalIgnoreCase)) return p.Value;
              return null;
          }

          static string? FindString(JToken root, string key) {
              var t = FindToken(root, key);
              if (t == null) return null;
              if (t.Type == JTokenType.String) return t.Value<string>();
              var s = t.ToString(Formatting.None);
              return s.Length > 1000 ? s[..1000] : s;
          }
          CS
          dotnet build -c Release

      - name: Parse Nacht map
        run: |
          set +e
          mkdir -p audit-out
          dotnet "$RUNNER_TEMP/cue4map/bin/Release/net8.0/cue4map.dll" "$PAK_ROOT" audit-out/nacht-map-actors.json 2>&1 | tee audit-out/cue4parse.log
          RC=${PIPESTATUS[0]}
          echo "$RC" > audit-out/cue4parse.rc
          exit 0

      - name: Summarize results
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          p=pathlib.Path('audit-out/nacht-map-actors.json')
          if not p.exists():
              print(pathlib.Path('audit-out/cue4parse.log').read_text(errors='replace')[-12000:])
              raise SystemExit(0)
          r=json.loads(p.read_text())
          print('exports',r['exportCount'],'selected',r['selectedCount'])
          c=collections.Counter(x.get('cls') for x in r['rows'])
          print('classes',c.most_common(40))
          meshes=[x for x in r['rows'] if x.get('staticMesh')]
          print('static mesh refs',len(meshes))
          for x in meshes[:200]:
              print(x['name'],x['cls'],x.get('staticMesh'),x.get('relativeLocation'),x.get('relativeRotation'),x.get('relativeScale3D'))
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pavlov-bo3-nacht-map-actor-audit
          path: audit-out/
          retention-days: 7
