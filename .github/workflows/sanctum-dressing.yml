name: Sanctum Dressing Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanctum-dressing.yml"
      - "ci/sanctum_dressing/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctum-dressing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest successful Sanctum build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="$(python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPO"]
          req=urllib.request.Request(
            f"https://api.github.com/repos/{repo}/actions/workflows/church-map-blender.yml/runs?status=success&per_page=20",
            headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          d=json.load(urllib.request.urlopen(req))
          runs=d.get("workflow_runs",[])
          if not runs: raise SystemExit("No successful Sanctum build found")
          print(runs[0]["id"])
          PY
          )"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using Sanctum build $RUN_ID"

      - name: Download Sanctum build
        uses: actions/download-artifact@v5
        with:
          name: Xziel-Sanctum-of-Ash-Runtime-Blockout
          path: sanctum
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender libegl1 libgl1-mesa-dri libglx-mesa0 xvfb

      - name: Build dressing overlay
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          BLEND="$(find sanctum -type f -name church_zombies_gameplay_v1.blend | head -n1)"
          PLAN="$(find sanctum -type f -name zombies_map_plan.json | head -n1)"
          FITTED="$(find sanctum -type f -name church_runtime_fitted_v2.json | head -n1)"
          test -s "$BLEND"; test -s "$PLAN"; test -s "$FITTED"
          mkdir -p dressing_out
          SANCTUM_BLEND="$BLEND" \
          SANCTUM_PLAN="$PLAN" \
          SANCTUM_FITTED="$FITTED" \
          SANCTUM_DRESS_OUT=dressing_out \
          xvfb-run -a -s "-screen 0 1280x720x24" \
            blender --background --python ci/sanctum_dressing/build_dressing.py \
            2>&1 | tee dressing_out/build.log
          test -s dressing_out/sanctum_dressing_v1.glb
          test -s dressing_out/sanctum_dressing_v1.blend
          test -s dressing_out/sanctum_dressing_v1.json
          test -s dressing_out/dressing_barricade_preview.png
          test -s dressing_out/dressing_altar_preview.png
          ls -lh dressing_out

      - name: Upload dressing
        uses: actions/upload-artifact@v4
        with:
          name: Sanctum-Dressing-V1
          path: dressing_out/
          if-no-files-found: error
          retention-days: 14
