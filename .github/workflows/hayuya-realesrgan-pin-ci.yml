name: HAYUYA Real-ESRGAN Runtime Pin CI

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - tools/hayuya3d/texture_runtimes.lock.json
      - tools/hayuya3d/texture_runtime.py
      - tools/hayuya3d/texture_superres.py
      - tools/hayuya3d/tests/test_texture_runtime.py
      - tools/hayuya3d/tests/test_texture_superres.py
      - .github/workflows/hayuya-realesrgan-pin-ci.yml

permissions:
  contents: read

jobs:
  verify-linux-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download complete official runtime bundle
        run: |
          set -euo pipefail
          url="https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip"
          curl --fail --location --retry 3 --output /tmp/realesrgan.zip "$url"
          echo "HAYUYA_REALESRGAN_ASSET_URL=$url"
          echo "HAYUYA_REALESRGAN_SHA256=$(sha256sum /tmp/realesrgan.zip | awk '{print $1}')"
          unzip -l /tmp/realesrgan.zip
          unzip -Z1 /tmp/realesrgan.zip | grep -E 'models/realesrgan-x4plus\.(param|bin)$'

      - name: Extract and verify runtime layout
        run: |
          set -euo pipefail
          mkdir -p /tmp/realesrgan
          unzip -q /tmp/realesrgan.zip -d /tmp/realesrgan
          exe="$(find /tmp/realesrgan -type f -name 'realesrgan-ncnn-vulkan' | head -n 1)"
          modeldir="$(find /tmp/realesrgan -type d -name models | head -n 1)"
          test -n "$exe"
          test -n "$modeldir"
          test -f "$modeldir/realesrgan-x4plus.param"
          test -f "$modeldir/realesrgan-x4plus.bin"
          chmod +x "$exe"
          "$exe" -h >/tmp/realesrgan-help.txt 2>&1 || true
          cat /tmp/realesrgan-help.txt
          grep -Eqi "usage|realesrgan|input-path" /tmp/realesrgan-help.txt
          echo "HAYUYA_REALESRGAN_RUNTIME_LAYOUT_PASS exe=$exe models=$modeldir"

      - name: Prove real x2 inference through Vulkan
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          image=Image.new("RGB",(16,16))
          pixels=image.load()
          for y in range(16):
              for x in range(16):
                  pixels[x,y]=(235,60,55) if (x//2+y//2)%2==0 else (35,185,220)
          image.save("/tmp/realesrgan-input.png")
          PY
          exe="$(find /tmp/realesrgan -type f -name 'realesrgan-ncnn-vulkan' | head -n 1)"
          modeldir="$(find /tmp/realesrgan -type d -name models | head -n 1)"
          "$exe" \
            -i /tmp/realesrgan-input.png \
            -o /tmp/realesrgan-output.png \
            -m "$modeldir" \
            -s 2 \
            -n realesrgan-x4plus \
            -f png
          python - <<'PY'
          from PIL import Image
          inp=Image.open("/tmp/realesrgan-input.png").convert("RGB")
          out=Image.open("/tmp/realesrgan-output.png").convert("RGB")
          assert inp.size==(16,16),inp.size
          assert out.size==(32,32),out.size
          spread=max(high-low for low,high in out.getextrema())
          assert spread>25,("flat super-resolution output",out.getextrema())
          print(
              "HAYUYA_REALESRGAN_REAL_INFERENCE_PASS",
              "input",inp.size,
              "output",out.size,
              "spread",spread,
          )
          PY

      - name: Upload pin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-realesrgan-pin-evidence
          path: |
            /tmp/realesrgan-help.txt
            /tmp/realesrgan-input.png
            /tmp/realesrgan-output.png
          retention-days: 7
