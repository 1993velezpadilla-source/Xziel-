name: Pavlov BO3 Nacht Material Channel Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-material-audit.yml"

jobs:
  audit-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install SteamCMD and unpack Nacht
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev libpng-dev build-essential perl git p7zip-full
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/repak"
          curl -fL --retry 6 --retry-delay 2 --retry-all-errors https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o "$RUNNER_TEMP/steamcmd.tgz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tgz" -C "$RUNNER_TEMP/steamcmd"
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true
          set +e
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +login anonymous +workshop_download_item 555160 2755515831 validate +quit 2>&1 | tee "$RUNNER_TEMP/steamcmd.log"
          set -e
          ROOT=$(find "$HOME" "$RUNNER_TEMP" -type d -path '*/steamapps/workshop/content/555160/2755515831' -print -quit 2>/dev/null)
          test -n "$ROOT"
          PAK="$ROOT/WindowsNoEditor.pak"; test -f "$PAK"
          curl -fL https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/repak.tar.xz"
          tar -xJf "$RUNNER_TEMP/repak.tar.xz" -C "$RUNNER_TEMP/repak"
          REPAK=$(find "$RUNNER_TEMP/repak" -type f -name 'repak*' -perm -111 | head -1)
          mkdir -p "$RUNNER_TEMP/unpacked"
          "$REPAK" unpack "$PAK" -o "$RUNNER_TEMP/unpacked"
          echo "UNPACKED=$RUNNER_TEMP/unpacked" >> "$GITHUB_ENV"

      - name: Build UE Viewer / UModel
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/gildor2/UEViewer.git "$RUNNER_TEMP/UEViewer"
          cd "$RUNNER_TEMP/UEViewer"
          ./build.sh
          UMODEL=$(realpath "$(find . -type f -name umodel -perm -111 | head -1)")
          test -n "$UMODEL"
          echo "UMODEL=$UMODEL" >> "$GITHUB_ENV"

      - name: Export MAP_FILES material metadata
        run: |
          set -euo pipefail
          MAPROOT="$UNPACKED/Pavlov/Content/CustomMaps/UGC2755515831/CoD_nacht/MAP_FILES"
          OUT="$RUNNER_TEMP/umodel-materials"
          mkdir -p "$OUT" audit-out
          find "$MAPROOT" -type f -name '*.uasset' | sort > "$RUNNER_TEMP/map-uassets.txt"
          ok=0; fail=0
          while IFS= read -r file; do
            rel=${file#"$UNPACKED/"}
            if "$UMODEL" -export -gltf -game=ue4.21 -path="$UNPACKED" -out="$OUT" "$rel" >/dev/null 2>&1; then ok=$((ok+1)); else fail=$((fail+1)); fi
          done < "$RUNNER_TEMP/map-uassets.txt"
          echo "packages_ok=$ok"
          echo "packages_fail=$fail"

          python3 - <<'PY'
          import collections,json,os,pathlib,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'umodel-materials'
          mats=sorted(root.rglob('*.mat'))
          channels=collections.Counter()
          suffixes=collections.Counter()
          texture_refs=collections.Counter()
          rows=[]
          keys=('Diffuse','Normal','Specular','SpecPower','Opacity','Emissive','Cube','Mask')
          for p in mats:
              vals={}
              others=[]
              for raw in p.read_text(errors='replace').splitlines():
                  line=raw.strip()
                  if not line or '=' not in line: continue
                  k,v=line.split('=',1)
                  if k in keys:
                      vals[k]=v; channels[k]+=1
                      texture_refs[v]+=1
                      m=re.search(r'_([cnsg])$',v,re.I)
                      if m: suffixes['_'+m.group(1).lower()]+=1
                  elif k.startswith('Other['):
                      others.append(v); texture_refs[v]+=1
                      m=re.search(r'_([cnsg])$',v,re.I)
                      if m: suffixes['_'+m.group(1).lower()]+=1
              rows.append({'material':p.stem,'channels':vals,'other_textures':others})
          report={
              'material_count':len(mats),
              'channel_counts':dict(channels),
              'texture_suffix_counts':dict(suffixes),
              'unique_texture_refs':len(texture_refs),
              'materials':rows,
          }
          pathlib.Path('audit-out/nacht-material-channel-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='materials'},indent=2))
          for r in rows[:120]: print(json.dumps(r,sort_keys=True))
          PY

      - name: Upload metadata report only
        uses: actions/upload-artifact@v4
        with:
          name: pavlov-bo3-nacht-material-audit
          path: audit-out/
          if-no-files-found: error
          retention-days: 7
