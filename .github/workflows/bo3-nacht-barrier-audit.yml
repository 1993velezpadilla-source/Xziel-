name: BO3 Nacht ZC Barrier Audit

on:
  push:
    branches:
      - experiment/bo3-nacht-barrier-audit
    paths:
      - ".github/workflows/bo3-nacht-barrier-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools p7zip-full file
      - name: Download public ZC barrier release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barriers"
          cd "$RUNNER_TEMP/barriers"
          megadl 'https://mega.nz/file/d6ommAjL#MOoqQXk0XZ-t5bmboPO5jJNRaoiCVWn9pp51ZVwawzc'
          FILE=$(find . -maxdepth 1 -type f -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -n "$FILE"
          echo "PACK=$RUNNER_TEMP/barriers/${FILE#./}" >> "$GITHUB_ENV"
          ls -lh "$FILE"
      - name: Inventory Nacht barrier subset
        run: |
          set -euo pipefail
          mkdir -p audit-out
          sha256sum "$PACK" | tee audit-out/payload.sha256
          file "$PACK" | tee audit-out/payload.filetype
          7z l -slt "$PACK" > audit-out/archive-list.txt
          python3 - <<'PY'
          import collections,json,pathlib
          txt=pathlib.Path('audit-out/archive-list.txt').read_text(errors='replace')
          paths=[]; sizes={}; current=None
          for line in txt.splitlines():
              if line.startswith('Path = '):
                  current=line[7:].strip(); paths.append(current)
              elif current and line.startswith('Size = '):
                  try:sizes[current]=int(line[7:].strip())
                  except:pass
          ext=collections.Counter((pathlib.PurePath(p).suffix.lower() or '<none>') for p in paths)
          nacht=[p for p in paths if any(k in p.lower() for k in ('nacht','prototype','nac','verruckt','barrier'))]
          report={'entries':len(paths),'extensions':dict(ext.most_common()),'nacht_related':nacht,'largest':sorted(({'path':p,'bytes':sizes.get(p,0)} for p in paths),key=lambda x:-x['bytes'])[:300]}
          pathlib.Path('audit-out/inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2)[:50000])
          PY
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: bo3-nacht-zc-barrier-audit
          path: audit-out/
          retention-days: 7
