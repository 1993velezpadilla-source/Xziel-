name: MeloTTS La Llorona Search Loop

on:
  push:
    branches:
      - audio/llorona-elevenlabs
    paths:
      - "tools/audio/generate_llorona_search_melotts.py"
      - ".github/workflows/melotts-llorona-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install audio dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          git clone https://github.com/myshell-ai/MeloTTS.git /tmp/MeloTTS
          git -C /tmp/MeloTTS checkout 209145371cff8fc3bd60d7be902ea69cbdb7965a
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<81"
          python -m pip install -e /tmp/MeloTTS
          python -m unidic download

      - name: Render search loop
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist/llorona-search
          python tools/audio/generate_llorona_search_melotts.py

      - name: Validate
        shell: bash
        run: |
          set -euxo pipefail
          test -s dist/llorona-search/llorona_mis_hijos_SEARCH_LOOP_48k.wav
          test -s dist/llorona-search/llorona_mis_hijos_SEARCH_LOOP_48k.ogg
          test -s dist/llorona-search/manifest.json
          ffprobe -v error -show_entries format=duration,size -of json dist/llorona-search/llorona_mis_hijos_SEARCH_LOOP_48k.wav

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: xziel-llorona-search-loop
          path: dist/llorona-search/
          if-no-files-found: error
          retention-days: 14
