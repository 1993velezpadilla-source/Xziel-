name: BO3 Nacht Madgaz Pack Audit

on:
  push:
    branches:
      - experiment/bo3-nacht-madgaz-pack-audit
    paths:
      - ".github/workflows/bo3-nacht-madgaz-pack-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full file
          python3 -m pip install --user gdown
      - name: Download archived public Nacht ZC model pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nacht-pack"
          python3 -m gdown --id 1LK3xMftaeoY_DLmkvkp2btf2XsN1zCQe -O "$RUNNER_TEMP/nacht-pack/payload.bin"
          ls -lh "$RUNNER_TEMP/nacht-pack/payload.bin"
          sha256sum "$RUNNER_TEMP/nacht-pack/payload.bin" | tee "$RUNNER_TEMP/nacht-pack/payload.sha256"
          file "$RUNNER_TEMP/nacht-pack/payload.bin" | tee "$RUNNER_TEMP/nacht-pack/payload.filetype"
      - name: Inventory pack
        run: |
          set -euo pipefail
          mkdir -p audit-out
          cp "$RUNNER_TEMP/nacht-pack/payload.sha256" audit-out/
          cp "$RUNNER_TEMP/nacht-pack/payload.filetype" audit-out/
          7z l -slt "$RUNNER_TEMP/nacht-pack/payload.bin" > audit-out/archive-list.txt
          python3 - <<'PY'
          import collections,json,pathlib,re
          txt=pathlib.Path('audit-out/archive-list.txt').read_text(errors='replace')
          paths=[]; sizes={}; current=None
          for line in txt.splitlines():
              if line.startswith('Path = '):
                  current=line[7:].strip(); paths.append(current)
              elif current and line.startswith('Size = '):
                  try:sizes[current]=int(line[7:].strip())
                  except:pass
          ext=collections.Counter((pathlib.PurePosixPath(x).suffix.lower() or '<none>') for x in paths)
          hits=[x for x in paths if any(k in x.lower() for k in ('nacht','prototype','p7_zm_nac','xmodel','texture','material','gdt','image','model_export','source_data'))]
          report={
            'drive_file_id':'1LK3xMftaeoY_DLmkvkp2btf2XsN1zCQe',
            'entries':len(paths),
            'extensions':dict(ext.most_common()),
            'interesting_paths':hits[:10000],
            'largest':sorted(({'path':p,'bytes':sizes.get(p,0)} for p in paths),key=lambda x:-x['bytes'])[:300]
          }
          pathlib.Path('audit-out/inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2)[:40000])
          PY
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: bo3-nacht-madgaz-pack-audit
          path: audit-out/
          retention-days: 7
