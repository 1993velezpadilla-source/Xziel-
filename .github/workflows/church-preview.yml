name: Sanctum Lightweight Preview

on:
  workflow_run:
    workflows: ["Build Church Map with Blender"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sanctum-lightweight-preview
  cancel-in-progress: true

jobs:
  extract-preview:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve source run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" && -n "${EVENT_RUN_ID:-}" ]]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(python3 - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/church-map-blender.yml/runs?status=success&per_page=10",
              headers={
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
              },
          )
          runs=json.load(urllib.request.urlopen(req)).get("workflow_runs",[])
          if not runs:
              raise SystemExit("No successful Sanctum build found")
          print(runs[0]["id"])
          PY
          )"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download full Sanctum build server-side
        uses: actions/download-artifact@v5
        with:
          name: Xziel-Sanctum-of-Ash-Runtime-Blockout
          path: full
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Extract lightweight inspection payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          for f in \
            exterior_3q.png \
            exterior_opposite.png \
            top_layout.png \
            entry_axis.png \
            zombies_gameplay_top.png \
            zombies_gameplay_iso.png \
            zombies_tower_quest.png \
            church_scene_report.json \
            zombies_map_plan.json \
            church_runtime_fitted_v2.json \
            vril_static_mesh_report.json \
            map-package-preflight.log \
            runtime-fitted-v2.log \
            vril-static-export.log
          do
            if [[ -s "full/$f" ]]; then
              cp "full/$f" "preview/$f"
            fi
          done

          python3 - <<'PY'
          import json, pathlib
          out={}
          for name in ["church_scene_report.json","church_runtime_fitted_v2.json","vril_static_mesh_report.json"]:
              p=pathlib.Path("preview")/name
              if p.exists():
                  out[name]=json.loads(p.read_text())
          pathlib.Path("preview/preview_summary.json").write_text(
              json.dumps(out, indent=2), encoding="utf-8")
          PY

          test -s preview/exterior_3q.png
          test -s preview/zombies_gameplay_iso.png
          test -s preview/vril_static_mesh_report.json
          du -sh preview

      - name: Upload lightweight Sanctum preview
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-Sanctum-Lightweight-Preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
