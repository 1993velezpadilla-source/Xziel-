name: Hayuya GPU E2E

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - .github/workflows/hayuya-gpu-e2e.yml
      - tools/hayuya3d/gpu_e2e.sh
      - tools/hayuya3d/gpu_doctor.py
      - tools/hayuya3d/gpu_verify.py

permissions:
  contents: read

concurrency:
  group: hayuya-gpu-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate GPU harness syntax
        run: |
          bash -n tools/hayuya3d/gpu_e2e.sh
          python -m py_compile tools/hayuya3d/gpu_doctor.py tools/hayuya3d/gpu_verify.py

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, hayuya-gpu]
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Run one-photo GPU proof
        run: bash tools/hayuya3d/gpu_e2e.sh
      - name: Upload HAYUYA GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-gpu-e2e
          path: out/gpu-e2e/**
          if-no-files-found: warn
          retention-days: 14
