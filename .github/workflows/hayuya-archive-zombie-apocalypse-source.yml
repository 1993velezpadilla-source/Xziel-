name: HAYUYA Archive Zombie Apocalypse Source

on:
  workflow_dispatch:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - .github/workflows/hayuya-archive-zombie-apocalypse-source.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/hayuya-monster-v1
          fetch-depth: 1

      - name: Download every accessible file from public CC0 folder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet "gdown>=6.1,<7"
          rm -rf /tmp/hayuya-zombie-apocalypse
          mkdir -p /tmp/hayuya-zombie-apocalypse
          folder="https://drive.google.com/drive/folders/1mWP6sCHun7OUMHQeDNZLrXTteXlzWg_t?usp=sharing"

          gdown "$folder" --folder --json > /tmp/zap-files.json
          python - <<'PY'
          import json, pathlib, subprocess, time
          items=json.loads(pathlib.Path("/tmp/zap-files.json").read_text())
          root=pathlib.Path("/tmp/hayuya-zombie-apocalypse")
          missing=[]
          print("HAYUYA_ZAP_EXPECTED",len(items))
          for i,item in enumerate(items,1):
              url=item.get("url")
              rel=item.get("path")
              if not url or not rel:
                  missing.append({"path":rel,"url":url,"reason":"bad_listing"})
                  continue
              dst=root/pathlib.PurePosixPath(rel)
              dst.parent.mkdir(parents=True,exist_ok=True)
              ok=False
              last=""
              for attempt in range(1,5):
                  cmd=["gdown",url,"-O",str(dst),"--retries","3"]
                  if dst.exists() and dst.stat().st_size>0:
                      cmd.append("--continue")
                  proc=subprocess.run(cmd,text=True,capture_output=True)
                  if proc.returncode==0 and dst.exists() and dst.stat().st_size>0:
                      ok=True
                      break
                  last=(proc.stderr or proc.stdout or "")[-1200:]
                  time.sleep(attempt*1.5)
              print("HAYUYA_ZAP_FILE",i,len(items),"OK" if ok else "FAILED",rel)
              if not ok:
                  missing.append({"path":rel,"url":url,"reason":last})
                  try: dst.unlink()
                  except FileNotFoundError: pass
          pathlib.Path("/tmp/zap-missing.json").write_text(json.dumps(missing,indent=2)+"\n")
          print("HAYUYA_ZAP_MISSING",len(missing))
          if missing:
              for row in missing:
                  print("MISSING",row["path"],row["url"])
          PY

      - name: Validate and package source
        shell: bash
        run: |
          set -euo pipefail
          files="$(find /tmp/hayuya-zombie-apocalypse -type f | wc -l)"
          bytes="$(du -sb /tmp/hayuya-zombie-apocalypse | cut -f1)"
          echo "HAYUYA_ZAP_FILES=$files"
          echo "HAYUYA_ZAP_BYTES=$bytes"
          test "$files" -gt 5
          test "$bytes" -gt 1000000
          test "$bytes" -lt 1000000000
          dst="hayuya/source_archives/quaternius_zombie_apocalypse"
          rm -rf "$dst"
          mkdir -p "$dst/parts"
          cp /tmp/zap-files.json "$dst/DRIVE_LISTING.json" 2>/dev/null || true
          cp /tmp/zap-missing.json "$dst/MISSING.json" 2>/dev/null || echo '[]' > "$dst/MISSING.json"

          (
            cd /tmp/hayuya-zombie-apocalypse
            find . -type f -printf '%P\n' | sort > "$GITHUB_WORKSPACE/$dst/INVENTORY.txt"
          )

          cat > "$dst/SOURCE.txt" <<'EOF'
          Title: Zombie Apocalypse Kit
          Creator: Quaternius
          License on original pack page: CC0
          Original pack page: https://quaternius.com/packs/zombieapocalypsekit.html
          Public creator Patreon post: https://www.patreon.com/posts/zombie-kit-60-100385247
          Public Google Drive folder: https://drive.google.com/drive/folders/1mWP6sCHun7OUMHQeDNZLrXTteXlzWg_t
          HAYUYA storage: lossless tar.gz split into GitHub-safe chunks. Reassemble chunks in lexical order before extraction.
          EOF

          tar -C /tmp/hayuya-zombie-apocalypse -czf /tmp/quaternius_zombie_apocalypse.tar.gz .
          sha256sum /tmp/quaternius_zombie_apocalypse.tar.gz > "$dst/SHA256.txt"
          split -b 90M -d -a 3             /tmp/quaternius_zombie_apocalypse.tar.gz             "$dst/parts/quaternius_zombie_apocalypse.tar.gz.part-"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("hayuya/source_archives/quaternius_zombie_apocalypse")
          parts=[]
          for p in sorted((root/"parts").glob("*")):
              parts.append({"path":str(p).replace("\\","/"),"bytes":p.stat().st_size})
          inventory=(root/"INVENTORY.txt").read_text().splitlines()
          missing=json.loads((root/"MISSING.json").read_text()) if (root/"MISSING.json").exists() else []
          listing=json.loads((root/"DRIVE_LISTING.json").read_text()) if (root/"DRIVE_LISTING.json").exists() else []
          manifest={
              "schema":1,
              "id":"quaternius_zombie_apocalypse",
              "license":"CC0",
              "source_page":"https://quaternius.com/packs/zombieapocalypsekit.html",
              "drive_folder":"https://drive.google.com/drive/folders/1mWP6sCHun7OUMHQeDNZLrXTteXlzWg_t",
              "expected_file_count":len(listing),
              "source_file_count":len(inventory),
              "missing_file_count":len(missing),
              "complete":len(missing)==0 and len(listing)>0,
              "missing":missing,
              "parts":parts,
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Commit archived source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hayuya/source_archives/quaternius_zombie_apocalypse
          if git diff --cached --quiet; then
            echo "Zombie Apocalypse source already archived."
            exit 0
          fi
          git commit -m "hayuya: archive Quaternius Zombie Apocalypse CC0 source"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin art/hayuya-monster-v1
            if git push origin HEAD:art/hayuya-monster-v1; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
