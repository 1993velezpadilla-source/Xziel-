name: Pavlov BO3 Nacht WallBuy Repair Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-wallbuy-repair-audit.yml"
      - "tools/maps/build_pavlov_nacht_wallbuy_repair_plan.py"
      - "experiments/bo3_nacht_reference/chalk_bounds_umodel_v1.json"

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download Pavlov Nacht Workshop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'steamcmd.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'steamcmd.zip') -DestinationPath $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item 555160 2755515831 validate +quit
          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName -like '*steamapps\workshop\content\555160\2755515831'} | Select-Object -First 1
          if(-not $root){throw 'payload not found'}
          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not (Test-Path $pak)){throw 'pak missing'}
          "PAK=$pak" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Unpack PAK and export map JSON
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'repak.zip')
          $repakDir=Join-Path $env:RUNNER_TEMP 'repak'
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'repak.zip') -DestinationPath $repakDir -Force
          $repak=Get-ChildItem $repakDir -Filter repak.exe -Recurse | Select-Object -First 1
          $out=Join-Path $env:RUNNER_TEMP 'pakextract'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $repak.FullName unpack $env:PAK -o $out
          if($LASTEXITCODE -ne 0){throw 'repak failed'}
          $map=Get-ChildItem $out -Filter 'Nacht_de_Untoten.umap' -Recurse | Select-Object -First 1
          if(-not $map){throw 'map missing'}
          Invoke-WebRequest 'https://github.com/atenfyr/UAssetGUI/releases/download/v1.1.0/UAssetGUI.exe' -OutFile (Join-Path $env:RUNNER_TEMP 'UAssetGUI.exe')
          $audit=(New-Item -ItemType Directory -Force -Path 'audit-out').FullName
          $json=Join-Path $audit 'Nacht_de_Untoten.json'
          & (Join-Path $env:RUNNER_TEMP 'UAssetGUI.exe') tojson $map.FullName $json VER_UE4_21
          if($LASTEXITCODE -ne 0){throw 'map export failed'}
          if(-not(Test-Path $json)){throw "map JSON missing at $json"}
          "MAP_JSON=$json" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build complete nine-slot wallbuy repair plan
        shell: pwsh
        run: |
          python tools/maps/build_pavlov_nacht_wallbuy_repair_plan.py $env:MAP_JSON experiments/bo3_nacht_reference/chalk_bounds_umodel_v1.json audit-out/nacht-wallbuy-repair-plan.json
          if($LASTEXITCODE -ne 0){throw 'wallbuy repair validation failed'}
          Get-Content audit-out/nacht-wallbuy-repair-plan.json | Select-Object -First 240

      - name: Upload metadata audit
        uses: actions/upload-artifact@v4
        with:
          name: pavlov-bo3-nacht-wallbuy-repair-audit
          path: audit-out/nacht-wallbuy-repair-plan.json
          if-no-files-found: error
          retention-days: 7
