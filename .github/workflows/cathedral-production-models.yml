name: Cathedral Blender Production

on:
  push:
    branches:
      - art/cathedral-production-models
    paths:
      - "tools/blender/build_cathedral_roster.py"
      - "tools/blender/cathedral_roster.json"
      - ".github/workflows/cathedral-production-models.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cathedral-production-models
  cancel-in-progress: true

jobs:
  build-production-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Linux render dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils unzip git libegl1 libgl1-mesa-dri libglx-mesa0 mesa-utils xvfb

      - name: Cache Blender 4.5.14 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: /opt/blender-4.5.14
          key: blender-linux-x64-4.5.14

      - name: Install Blender 4.5.14 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender-4.5.14
          sudo tar -xJf /tmp/blender.tar.xz --strip-components=1 -C /opt/blender-4.5.14

      - name: Build and install MPFB2
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mpfb2 /tmp/mpfb.zip
          git clone https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          git -C /tmp/mpfb2 checkout b58176c661a9680294eb75f127842cb8378e4974
          /opt/blender-4.5.14/blender --command extension build --source-dir /tmp/mpfb2/src/mpfb --output-filepath /tmp/mpfb.zip
          /opt/blender-4.5.14/blender --command extension install-file -r user_default -e /tmp/mpfb.zip

      - name: Cache MakeHuman CC0 system assets
        id: cache-mhassets
        uses: actions/cache@v4
        with:
          path: /tmp/mhassets
          key: makehuman-system-assets-cc0-v2026

      - name: Download MakeHuman CC0 system assets
        if: steps.cache-mhassets.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/mhassets
          mkdir -p /tmp/mhassets
          curl -fL --retry 4 https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip -o /tmp/makehuman_system_assets_cc0.zip
          unzip -q /tmp/makehuman_system_assets_cc0.zip -d /tmp/mhassets

      - name: Apply fidelity pass 14 source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/blender/build_cathedral_roster.py')
          s=p.read_text()

          def replace_func(name, body):
              global s
              pat=rf'def {name}\(.*?(?=\ndef [A-Za-z_][A-Za-z0-9_]*\()'
              n=re.subn(pat, body.rstrip()+'\n\n', s, count=1, flags=re.S)
              if n[1]!=1: raise SystemExit(f'failed replacing {name}: {n[1]}')
              s=n[0]

          replace_func('eye_socket_rings', '''def eye_socket_rings(body,h,mats,style):
              # Pass 13 QA: torus rings read as goggles. Keep bruising painted into the face instead.
              return []''')

          replace_func('priority_head_cover', '''def priority_head_cover(body,h,style,mats):
              out=[]
              if style in ("sister_of_ash","stained_shade"):
                  inner=mats["spectral_ivory"] if style=="stained_shade" else mats["dirty_ivory"]
                  outer=mats["spectral_ivory"] if style=="stained_shade" else mats["ash_blue"]
                  a=body_region_shell(body,"HeadCoif",inner,
                      lambda p: p.z/h>.890 and (p.y/h>-.052 or p.z/h>.940) and abs(p.x/h)<.105,.0075*h)
                  if a: out.append(a)
                  b=body_region_shell(body,"HoodCrown",outer,
                      lambda p: p.z/h>.915 and (p.y/h>-.040 or p.z/h>.955) and abs(p.x/h)<.112,.0120*h)
                  if b: out.append(b)
              elif style=="la_llorona":
                  cap=body_region_shell(body,"HairCap",mats["wet_black"],
                      lambda p: p.z/h>.885 and (p.y/h>-.055 or p.z/h>.940) and abs(p.x/h)<.108,.0060*h)
                  if cap: out.append(cap)
              return out''')

          replace_func('llorona_hair_mesh', '''def llorona_hair_mesh(h,mats):
              m=mats["wet_black"]; out=[]
              # Dense rear mass plus many fine curved wet strands; no flat barcode curtains.
              out.append(drape_open("HairDrape",h,m,[
                  (.995,.067,.061),(.965,.074,.067),(.925,.083,.074),(.875,.095,.082),
                  (.810,.109,.091),(.730,.126,.101),(.640,.143,.111),(.535,.158,.120),(.430,.166,.126)
              ],segments=96,theta_max=2.78,tatter=.085,phase=.7,subdiv=1))
              for i in range(58):
                  side=-1 if i%2==0 else 1
                  band=(i%29)/28.0
                  x=side*(.022+.070*band)*h
                  z0=(.988-.0025*(i%7))*h
                  z1=(.39+.20*((i*11)%17)/16.0)*h
                  y=(-.082-.008*math.sin(i*.63))*h
                  wave=.010*h*math.sin(i*.91)
                  pts=[(x,y,z0),(x*1.02+wave,y-.006*h,z0-.16*h),(x*1.08-wave,y+.004*h,z0-.36*h),(x*1.14+wave*.5,y+.012*h,z1)]
                  out.append(curve_chain("HairStrand_%02d"%i,pts,m,.00125*h))
              return out''')

          replace_func('stained_halo', '''def stained_halo(h,mats):
              metal=mats["oxidized_metal"]; out=[]
              y=.118*h; cz=.905*h; ro=.155*h; ri=.046*h
              out.append(torus("StainedHalo",(0,y,cz),ro,.0060*h,metal,rot=(math.radians(90),0,0)))
              cols=[mats["glass_blue"],mats["glass_cyan"],mats["glass_magenta"],mats["amber"]]
              seg=14
              for i in range(seg):
                  a0=2*math.pi*i/seg; a1=2*math.pi*(i+1)/seg
                  mid=(a0+a1)*.5
                  outer=ro*(.91+.055*math.sin(i*2.31))
                  vs=[(ri*math.cos(a0),y,cz+ri*math.sin(a0)),
                      (outer*math.cos(a0),y,cz+outer*math.sin(a0)),
                      (outer*math.cos(a1),y,cz+outer*math.sin(a1)),
                      (ri*math.cos(a1),y,cz+ri*math.sin(a1))]
                  mesh=bpy.data.meshes.new(f"HaloPane{i:02}Mesh"); mesh.from_pydata(vs,[],[(0,1,2,3)]); mesh.update()
                  o=bpy.data.objects.new(f"HaloPane{i:02}",mesh); bpy.context.collection.objects.link(o); assign(o,cols[i%4]); out.append(o)
              return out''')

          # Slim garment silhouette after construction, especially the cylindrical skirts flagged in QA.
          old='''    robe_for_style(style,h,w,d,mats)'''
          new='''    robe_objs=robe_for_style(style,h,w,d,mats)\n    if style in ("sister_of_ash","la_llorona","stained_shade"):\n        for _o in robe_objs or []:\n            if _o and hasattr(_o,"scale"):\n                _o.scale.x *= .82\n                _o.scale.y *= .90'''
          if old not in s: raise SystemExit('robe_for_style call not found')
          s=s.replace(old,new,1)

          s=s.replace('priority fidelity pass 13 — covered crowns, flat wet-hair ribbons, active corpse-face damage, visible eye bruising, cleaner Stained glass accents',
                      'priority fidelity pass 14 — slim silhouettes, full crown coverage, fine wet hair strands, no eye-ring goggles, enlarged stained-glass halo')
          p.write_text(s)
          PY

      - name: Build all real production characters
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euxo pipefail
          mkdir -p assets/generated/cathedral_roster
          xvfb-run -a -s "-screen 0 1280x1024x24" /opt/blender-4.5.14/blender --background --python tools/blender/build_cathedral_roster.py -- --assets-root /tmp/mhassets --spec tools/blender/cathedral_roster.json --out-dir assets/generated/cathedral_roster --only sister_of_ash,la_llorona,stained_shade

      - name: Validate production outputs
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m json.tool assets/generated/cathedral_roster/roster_build_summary.json
          for id in sister_of_ash la_llorona stained_shade; do
            test -s "assets/generated/cathedral_roster/$id/model.blend"
            test -s "assets/generated/cathedral_roster/$id/model.glb"
            test -s "assets/generated/cathedral_roster/$id/model.fbx"
            test -s "assets/generated/cathedral_roster/$id/preview.png"
            test -s "assets/generated/cathedral_roster/$id/preview_side.png"
            test -s "assets/generated/cathedral_roster/$id/preview_back.png"
            test -s "assets/generated/cathedral_roster/$id/preview_face.png"
            test -s "assets/generated/cathedral_roster/$id/manifest.json"
          done

      - name: Commit generated Blender assets and pass source to GitHub
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "cathedral-blender-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f assets/generated/cathedral_roster tools/blender/build_cathedral_roster.py
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "art: generate Cathedral priority roster fidelity pass 14"
            git pull --rebase origin art/cathedral-production-models
            git push origin HEAD:art/cathedral-production-models
          fi

      - name: Upload full production artifact
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-priority-models-pass14
          path: assets/generated/cathedral_roster/
          if-no-files-found: error
          retention-days: 14
