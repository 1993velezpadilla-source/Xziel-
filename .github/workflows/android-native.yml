name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build native APK + Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Xziel
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare full native NZ:P Android project
        shell: bash
        run: bash scripts/prepare_android.sh

      - name: Build debug APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk              dist/Xziel-NZP-native-universal-debug.apk
          ls -lh dist/Xziel-NZP-native-universal-debug.apk

      - name: Boot Android emulator and launch Xziel
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          echo no | "$AVDMANAGER" create avd             -n xziel-ci             -k "system-images;android-35;google_apis;x86_64"             --force

          nohup "${ANDROID_HOME}/emulator/emulator"             -avd xziel-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory 2048             > dist/emulator-stdout.txt 2>&1 &

          adb wait-for-device
          for i in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 2
          done

          adb install -r dist/Xziel-NZP-native-universal-debug.apk
          adb logcat -c
          adb shell am force-stop com.xziel.nzp || true
          adb shell am start -W -n com.xziel.nzp/org.libsdl.app.NZPActivity             > dist/am-start.txt 2>&1 || true

          sleep 25

          adb exec-out screencap -p > dist/xziel-screen.png || true
          adb logcat -d -v threadtime > dist/xziel-logcat.txt || true
          adb shell dumpsys activity processes > dist/activity-processes.txt || true

          PID="$(adb shell pidof com.xziel.nzp 2>/dev/null | tr -d '\r')"
          echo "PID=$PID"
          if [[ -z "$PID" ]]; then
            echo "Xziel process exited/crashed during smoke test."
            grep -Ei "FATAL EXCEPTION|Fatal signal|DEBUG|libmain|gl4es|SDL|xziel|com.xziel.nzp"               dist/xziel-logcat.txt | tail -n 300 || true
            exit 1
          fi

          echo "Xziel remained alive after 25 seconds."

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-runtime-diagnostics
          path: |
            dist/xziel-logcat.txt
            dist/xziel-screen.png
            dist/emulator-stdout.txt
            dist/am-start.txt
            dist/activity-processes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-NZP-native-universal-debug
          path: dist/Xziel-NZP-native-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail if smoke test crashed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1
