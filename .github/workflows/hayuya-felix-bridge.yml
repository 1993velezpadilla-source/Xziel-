name: Hayuya Felix Bridge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hayuya-felix-bridge.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hayuya-felix-bridge
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bridge workflow presence
        run: |
          grep -q 'legacy-cache-staging-03' .github/workflows/hayuya-felix-bridge.yml
          grep -q 'art/hayuya-monster-v1' .github/workflows/hayuya-felix-bridge.yml

  relay:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Felix request workspace
        run: git clone --depth 1 https://github.com/1993velezpadilla-source/legacy-cache-staging-03.git felix

      - name: Relay new Felix requests to central queue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          source_repo = '1993velezpadilla-source/legacy-cache-staging-03'
          source_ref = 'main'
          target_ref = 'art/hayuya-monster-v1'
          request_dir = Path('felix/hayuya/jobs/requests')
          job_re = re.compile(r'^[A-Za-z0-9._-]+$')

          def api(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.github.com' + url, data=data, method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read() or b'{}')
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  return exc.code, json.loads(body or b'{}')

          relayed = 0
          if request_dir.is_dir():
              for path in sorted(request_dir.glob('*.json')):
                  data = json.loads(path.read_text(encoding='utf-8'))
                  job_id = str(data.get('job_id', '')).strip()
                  owner = str(data.get('owner', 'Felix')).strip() or 'Felix'
                  title = str(data.get('title', job_id)).strip() or job_id
                  if data.get('schema') != 1 or not job_re.fullmatch(job_id):
                      print(f'SKIP invalid request {path}')
                      continue

                  data['source_repo'] = source_repo
                  data['source_ref'] = source_ref
                  target = f'hayuya/jobs/requests/felix-{job_id}.json'
                  encoded_target = urllib.parse.quote(target, safe='/')
                  status, _ = api(
                      'GET',
                      f'/repos/{repo}/contents/{encoded_target}?ref={urllib.parse.quote(target_ref, safe="")}',
                  )
                  if status == 200:
                      print(f'SKIP already relayed {job_id}')
                      continue
                  if status != 404:
                      raise SystemExit(f'GitHub lookup failed for {job_id}: HTTP {status}')

                  raw = (json.dumps(data, indent=2) + '\n').encode('utf-8')
                  payload = {
                      'message': f'HAYUYA_JOB {owner} :: {job_id} :: {title}',
                      'content': base64.b64encode(raw).decode('ascii'),
                      'branch': target_ref,
                  }
                  status, response = api('PUT', f'/repos/{repo}/contents/{encoded_target}', payload)
                  if status not in (200, 201):
                      raise SystemExit(f'GitHub relay failed for {job_id}: HTTP {status} {response}')
                  relayed += 1
                  print(f'RELAYED {job_id} -> {target}')

          print(f'HAYUYA_FELIX_RELAY count={relayed}')
          PY
