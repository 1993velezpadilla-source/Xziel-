name: Pichy AI Gate

on:
  workflow_dispatch:
  push:
    branches:
      - lab/pichy-ai-v1
    paths:
      - "pichy-ai/**"
      - ".github/workflows/pichy-ai-gate.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pichy-ai/requirements.txt
      - run: pytest -q pichy-ai/tests
      - name: Compile Python
        run: python -m compileall -q pichy-ai/agent pichy-ai/server
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path("pichy-ai").rglob("*.json"):
              json.loads(p.read_text())
              print("ok", p)
          PY

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        run: gradle -p pichy-ai/android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pichy-ai-lab-debug-apk
          path: pichy-ai/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
