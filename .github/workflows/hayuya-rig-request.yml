name: HAYUYA Rig Request

on:
  push:
    branches:
      - art/hayuya-monster-v1
    paths:
      - hayuya/rig_requests/**.json
      - .github/workflows/hayuya-rig-request.yml
      - tools/hayuya3d/blender_autorig.py
      - tools/hayuya3d/rig_gate.py
      - tools/hayuya3d/blender_animation_gate.py
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/hayuya-monster-v1
          fetch-depth: 2
      - id: collect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path(".")
          if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch":
              paths=sorted((root/"hayuya/rig_requests").glob("*.json")) if (root/"hayuya/rig_requests").is_dir() else []
          else:
              p=subprocess.run(["git","diff-tree","--no-commit-id","--name-only","-r",os.environ["GITHUB_SHA"]],text=True,stdout=subprocess.PIPE,check=True)
              paths=[root/x.strip() for x in p.stdout.splitlines() if x.startswith("hayuya/rig_requests/") and x.endswith(".json")]
          include=[]
          for path in paths:
              if not path.is_file(): continue
              d=json.loads(path.read_text())
              job=str(d.get("job_id",""))
              if not job or not all(ch.isalnum() or ch in "._-" for ch in job):
                  raise SystemExit("unsafe job_id")
              include.append({"job_id":job,"request":str(path),"owner":str(d.get("owner","HAYUYA"))})
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps({"include":include},separators=(",",":"))+"\n")
              f.write("count="+str(len(include))+"\n")
          print(json.dumps(include,indent=2))
          PY

  rig:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hayuya-rig-${{ matrix.job_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/hayuya-monster-v1
          fetch-depth: 1

      - name: Validate source model
        run: |
          set -euo pipefail
          test -s "hayuya/models/${{ matrix.job_id }}/model.glb"

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy

      - name: Build UAM2 bank on real model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "out/rig/${{ matrix.job_id }}"
          blender -b --python tools/hayuya3d/blender_autorig.py -- \
            --target "hayuya/models/${{ matrix.job_id }}/model.glb" \
            --donor hayuya/animation_library/quaternius-uam2/library.glb \
            --output "out/rig/${{ matrix.job_id }}/animated.glb" \
            --report "out/rig/${{ matrix.job_id }}/autorig-uam2.json"
          python tools/hayuya3d/rig_gate.py \
            "out/rig/${{ matrix.job_id }}/animated.glb" \
            --json "out/rig/${{ matrix.job_id }}/rig-uam2.json"
          blender -b --python tools/hayuya3d/blender_animation_gate.py -- \
            --model "out/rig/${{ matrix.job_id }}/animated.glb" \
            --reference "hayuya/models/${{ matrix.job_id }}/model.glb" \
            --json "out/rig/${{ matrix.job_id }}/anim-uam2.json" --samples 5 || true

      - name: Build UAM1 bank on real model
        shell: bash
        run: |
          set -euo pipefail
          blender -b --python tools/hayuya3d/blender_autorig.py -- \
            --target "hayuya/models/${{ matrix.job_id }}/model.glb" \
            --donor hayuya/animation_library/quaternius-uam1/library.glb \
            --output "out/rig/${{ matrix.job_id }}/animated-uam1.glb" \
            --report "out/rig/${{ matrix.job_id }}/autorig-uam1.json"
          python tools/hayuya3d/rig_gate.py \
            "out/rig/${{ matrix.job_id }}/animated-uam1.glb" \
            --json "out/rig/${{ matrix.job_id }}/rig-uam1.json"
          blender -b --python tools/hayuya3d/blender_animation_gate.py -- \
            --model "out/rig/${{ matrix.job_id }}/animated-uam1.glb" \
            --reference "hayuya/models/${{ matrix.job_id }}/model.glb" \
            --json "out/rig/${{ matrix.job_id }}/anim-uam1.json" --samples 5 || true

      - name: Confirm this is the latest rig request
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          job="${{ matrix.job_id }}"
          current=Path("${{ matrix.request }}")
          candidates=[]
          root=Path("hayuya/rig_requests")
          for p in root.glob("*.json"):
              try:
                  d=json.loads(p.read_text())
              except Exception:
                  continue
              if str(d.get("job_id",""))!=job:
                  continue
              candidates.append((
                  str(d.get("requested_at","")),
                  p.name,
                  p,
              ))
          latest=max(candidates,key=lambda x:(x[0],x[1]))[2] if candidates else current
          is_current=(latest.as_posix()==current.as_posix())
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("current="+("true" if is_current else "false")+"\n")
              out.write("latest="+latest.as_posix()+"\n")
          print("HAYUYA_RIG_REQUEST_FRESHNESS",json.dumps({
              "job_id":job,
              "current":current.as_posix(),
              "latest":latest.as_posix(),
              "is_current":is_current,
          },separators=(",",":")))
          PY

      - name: Persist animated real-model banks
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          job="${{ matrix.job_id }}"
          src="out/rig/$job"
          dst="hayuya/models/$job"
          cp "$src/animated.glb" "$dst/animated.glb"
          cp "$src/animated-uam1.glb" "$dst/animated-uam1.glb"
          cp "$src/rig-uam2.json" "$dst/rig_gate.json"
          cp "$src/rig-uam1.json" "$dst/rig_gate_uam1.json"
          cp "$src/anim-uam2.json" "$dst/animation_gate.json"
          cp "$src/anim-uam1.json" "$dst/animation_gate_uam1.json"
          cp "$src/autorig-uam2.json" "$dst/autorig-report.json"
          cp "$src/autorig-uam1.json" "$dst/autorig-report-uam1.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          job="${{ matrix.job_id }}"
          root=Path("hayuya/models")/job
          manifest_path=root/"manifest.json"
          manifest=json.loads(manifest_path.read_text()) if manifest_path.exists() else {"schema":2,"job_id":job}
          r2=json.loads((root/"rig_gate.json").read_text())
          r1=json.loads((root/"rig_gate_uam1.json").read_text())
          g2=json.loads((root/"animation_gate.json").read_text())
          g1=json.loads((root/"animation_gate_uam1.json").read_text())
          c2=[str(x) for x in g2.get("compatible_clips",[])]
          c1=[str(x) for x in g1.get("compatible_clips",[])]
          useful2=[x for x in c2 if "tpose" not in x.lower().replace("_","")]
          useful1=[x for x in c1 if "tpose" not in x.lower().replace("_","")]
          usable2=bool(r2.get("rig_ready")) and len(useful2)>=3
          usable1=bool(r1.get("rig_ready")) and len(useful1)>=3
          if not (usable2 or usable1):
              raise SystemExit(
                  "No animation bank passed the safe-motion minimum: "
                  f"uam2={len(useful2)} useful, uam1={len(useful1)} useful"
              )
          manifest["preview_model"]="animated.glb" if usable2 else "animated-uam1.glb"
          manifest["rig_quality_version"]=3
          manifest["asset_profile"]="character.humanoid"
          if isinstance(manifest.get("asset"),dict):
              manifest["asset"]["profile"]="character.humanoid"
          manifest["character"]={
            "rig_quality_version":3,
            "skeleton_type":(r2 if usable2 else r1).get("skeleton_type","hayuya_humanoid_v1"),
            "preview_pack":"hayuya_preview_pack_v1",
            "rig_ready":(usable2 if usable2 else usable1),
            "animation_ready":(usable2 if usable2 else usable1),
            "preview_animation_ready":(usable2 if usable2 else usable1),
            "animation_clips":(c2 if usable2 else c1),
            "weighted_joint_count":(r2 if usable2 else r1).get("weighted_joints",0),
            "weighted_joint_names":(r2 if usable2 else r1).get("weighted_joint_names",[]),
            "facial":(r2 if usable2 else r1).get("facial",{}),
            "secondary_motion":(r2 if usable2 else r1).get("secondary_motion",{}),
            "warnings":(r2 if usable2 else r1).get("warnings",[]),
            "deformation_qa":{
              "schema":(g2 if usable2 else g1).get("schema",1),
              "passed":(usable2 if usable2 else usable1),
              "full_bank_passed":bool((g2 if usable2 else g1).get("passed")),
              "action_count":(g2 if usable2 else g1).get("action_count",0),
              "compatible_clips":(c2 if usable2 else c1),
              "rejected_clip_count":(g2 if usable2 else g1).get("rejected_clip_count",0),
              "failures":(g2 if usable2 else g1).get("failures",[])
            }
          }
          manifest["animation_banks"]={
            "quaternius-uam2":{
              "model":"animated.glb",
              "clips":c2,
              "rig_ready":bool(r2.get("rig_ready")),
              "animation_ready":bool(r2.get("animation_ready")),
              "quality_passed":usable2,
              "full_bank_passed":bool(g2.get("passed")),
              "rig_quality_version":3
            },
            "quaternius-uam1":{
              "model":"animated-uam1.glb",
              "clips":c1,
              "rig_ready":bool(r1.get("rig_ready")),
              "animation_ready":bool(r1.get("animation_ready")),
              "quality_passed":usable1,
              "full_bank_passed":bool(g1.get("passed")),
              "rig_quality_version":3
            }
          }
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -m "hayuya: rig real model $job with local animation banks"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin art/hayuya-monster-v1 || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:art/hayuya-monster-v1; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Notify Hub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.freshness.outputs.current }}" != "true" ]]; then
            gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "⏭️ **RIG SUPERSEDED** — **${{ matrix.owner }}** / ${{ matrix.job_id }} — newer request exists; this run was not allowed to publish."
          elif [[ "${{ job.status }}" == "success" ]]; then
            gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "🦴 **RIG READY** — **${{ matrix.owner }}** / ${{ matrix.job_id }} — real model now carries a QA-approved local animation bank."
          else
            gh issue comment 55 --repo "$GITHUB_REPOSITORY" --body "❌ **RIG FAILED** — **${{ matrix.owner }}** / ${{ matrix.job_id }}"
          fi
