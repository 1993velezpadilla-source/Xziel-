name: Persist XZIEL Nacht Reference Package

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/persist-xziel-nacht-reference-package.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: experiment/bo3-nacht-standalone-audit
          fetch-depth: 0

      - name: Download verified GREEN audit artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: 1993velezpadilla-source/config-old-3
          run-id: 36228086203
          name: pavlov-bo3-nacht-uassetgui-audit
          path: ${{ runner.temp }}/nacht-green

      - name: Verify and stage metadata-only reference package
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/nacht-green/xziel-reference-package"
          test -f "$src/preflight.json"
          python3 - <<'PY'
          import json, os, pathlib
          src=pathlib.Path(os.environ['RUNNER_TEMP'])/'nacht-green'/'xziel-reference-package'
          pre=json.loads((src/'preflight.json').read_text())
          assert pre['ok'] is True, pre
          counts=pre['counts']
          assert counts['sceneInstances'] == 10791, counts
          assert counts['uniqueMeshes'] == 492, counts
          assert counts['purchaseSlots'] == 9, counts
          assert counts['barricades'] == 12, counts
          assert counts['zombieSpawns'] == 21, counts
          pkg_files={p.name for p in src.iterdir() if p.is_file()}
          expected={
            'map.json','manifest.json','scene_instances.json','assets.json',
            'entities.json','spawns.json','zones.json','environment.json',
            'collision.json','profiles.json','preflight.json'
          }
          assert expected <= pkg_files, sorted(pkg_files)
          PY

          dest="experiments/bo3_nacht_reference/xziel_reference_package"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a "$src"/. "$dest"/

          cat > "$dest/PROVENANCE.md" <<'EOF'
          # XZIEL BO3 Nacht reference package provenance

          Generated from verified GREEN CI run 36228086203.

          Source reference:
          - Pavlov Workshop 2755515831, Nacht_de_Untoten.umap (UE4.21 cooked community port)
          - BO3 internal map name: zm_prototype
          - T7 decompiled script structure used for canonical zone names/AI limit
          - Nine BO3 purchase markers resolved from baked chalk geometry

          Validation:
          - 10,791 CoD_nacht scene instances
          - 492 unique meshes
          - 12 barricades
          - 21 zombie spawns
          - 9 purchase slots (3 authored functional + 6 geometry-derived)
          - purchase calibration RMSE: 3.642585764715487 cm
          - 3 canonical zones

          This directory contains metadata/layout only. It does not contain the
          third-party Pavlov PAK or extracted BO3 mesh/texture payloads.
          EOF

      - name: Commit reference package
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/bo3_nacht_reference/xziel_reference_package
          if git diff --cached --quiet; then
            echo "Reference package already persisted; no changes."
            exit 0
          fi
          git commit -m "reference: persist validated XZIEL BO3 Nacht metadata package"
          git push origin HEAD:experiment/bo3-nacht-standalone-audit
