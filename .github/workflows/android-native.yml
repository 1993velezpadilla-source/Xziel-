name: Native Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "README.md"
      - "assets/nacht_enhanced/**"
      - "docs/NACHT_ENHANCED*.md"
  push:
    branches:
      - main
      - feature/v022-nacht-enhanced-runtime
      - feature/nacht-enchanted-map
    paths:
      - ".github/workflows/android-native.yml"
      - "android/**"
      - "scripts/**"
      - "README.md"
      - "assets/nacht_enhanced/**"
      - "docs/NACHT_ENHANCED*.md"

concurrency:
  group: xziel-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-and-smoke-test:
    name: Build native APK + Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Xziel
        uses: actions/checkout@v5

      - name: Publish CI run pointer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="xziel/android-enhanced" \
            -f description="Nacht Enhanced Android build is running" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and emulator
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"             "emulator"             "system-images;android-35;google_apis;x86_64"

      - name: Prepare full native NZ:P Android project
        shell: bash
        run: bash scripts/prepare_android.sh

      - name: Verify Nacht Enhanced integration
        shell: bash
        run: |
          grep -q 'xziel_nacht_enhanced' build/deps/vril/source/input.c
          grep -q 'Xziel_NachtEnhanced_Init' build/deps/quakec/source/server/main.qc
          grep -q 'Xziel_NachtEnhanced_Render' build/deps/quakec/source/client/main.qc
          grep -q 'if (bsp_name == "ndu")' build/deps/quakec/source/menu/menu_maps.qc
          grep -q 'cvar_set("xziel_nacht_enhanced", "0")' build/deps/quakec/source/menu/menu_maps.qc
          grep -q 'if (bsp_name == "ndu_enchanted")' build/deps/quakec/source/menu/menu_maps.qc
          grep -q 'cvar_set("xziel_nacht_enhanced", "1")' build/deps/quakec/source/menu/menu_maps.qc
          if grep -q 'Menu_Lobby_ToggleNachtEnhanced\|MAP VERSION: ENCHANTED\|lo_enh' build/deps/quakec/source/menu/menu_loby.qc; then
            echo "Separate-map architecture regressed: lobby toggle returned"
            exit 1
          fi
          if grep -q 'NACHT VISUALS\|ge_enhc' build/deps/quakec/source/menu/menu_gset.qc; then
            echo "Separate-map architecture regressed: game-settings toggle returned"
            exit 1
          fi
          if grep -R -q 'mapname == "ndu" && cvar("xziel_nacht_enhanced")' build/deps/quakec/source; then
            echo "Stock ndu still has an Enchanted runtime path"
            exit 1
          fi
          grep -q 'flames.flame_particle' build/deps/quakec/source/client/main.qc
          grep -q 'weapons.impact' build/deps/quakec/source/client/main.qc
          grep -q 'xziel_nacht_fx_next_lightning' build/deps/quakec/source/client/main.qc
          grep -q 'The Enchanted practice map uses the existing NZ:P dismemberment state' build/deps/quakec/source/server/weapons/weapon_core.qc
          grep -q 'Legs-to-crawler conversion already exists in stock NZ:P' build/deps/quakec/source/server/ai/crawler_core.qc
          test -s build/nzp-data/nzp/models/ai/zcfull.mdl
          test -s 'build/nzp-data/nzp/models/ai/zbc%.mdl'
          test -s 'build/nzp-data/nzp/models/ai/zh^.mdl'
          test -s 'build/nzp-data/nzp/models/ai/zal(.mdl'
          test -s 'build/nzp-data/nzp/models/ai/zar(.mdl'
          grep -q '#define.*MAXALIASVERTS.*8192' build/deps/vril/source/platform/sdl/gl/gl_model.h
          grep -q '#define.*MAXALIASTRIS.*8192' build/deps/vril/source/platform/sdl/gl/gl_model.h
          grep -q 'MAXALIASTRIS \* 7 + 1' build/deps/vril/source/platform/sdl/gl/gl_mesh.c
          grep -q 'models/xziel_lab/zombie_basic.mdl' build/deps/quakec/source/server/main.qc
          grep -q 'mapname == "ndu_enchanted"' build/deps/quakec/source/server/main.qc
          grep -q 'models/xziel_lab/zombie_basic.mdl' build/deps/quakec/source/client/zombie.qc
          test -s build/nzp-data/nzp/models/xziel_lab/zombie_basic.mdl
          test -s build/nzp-data/nzp/models/xziel_lab/zombie_basic.mdl_0.tga
          test -s build/nzp-data/nzp/models/xziel_lab/zombie_basic.json
          test -s build/nzp-data/nzp/licenses/XZIEL-QUATERNIUS-ZOMBIE-CC0.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          path = Path("build/nzp-data/nzp/models/xziel_lab/zombie_basic.mdl")
          data = path.read_bytes()
          hdr = struct.unpack_from("<4si3f3ff3f8if", data, 0)
          ident, version = hdr[0], hdr[1]
          numskins, skinw, skinh = hdr[12], hdr[13], hdr[14]
          numverts, numtris, numframes = hdr[15], hdr[16], hdr[17]
          if ident != b"IDPO" or version != 6:
              raise SystemExit(f"unexpected Lab zombie MDL signature/version: {ident!r} v{version}")
          if numskins != 1:
              raise SystemExit(f"unexpected Lab zombie skin count: {numskins}")
          if not (4000 <= numverts <= 8192):
              raise SystemExit(f"unexpected Lab zombie vertex count: {numverts}")
          if not (7000 <= numtris <= 8192):
              raise SystemExit(f"unexpected Lab zombie triangle count: {numtris}")
          if numframes != 211:
              raise SystemExit(f"Lab zombie must mirror NZ:P frames 0..210, got {numframes}")
          if skinw <= 0 or skinh <= 0 or skinw > 480 or skinh > 480:
              raise SystemExit(f"MDL fallback skin exceeds Vril legacy limit: {skinw}x{skinh}")
          meta = json.loads(Path("build/nzp-data/nzp/models/xziel_lab/zombie_basic.json").read_text())
          if meta["license"] != "CC0-1.0" or meta["frames"] != 211:
              raise SystemExit(f"bad Lab zombie metadata: {meta}")
          if max(meta["mdl_skin"]) > 480 or max(meta["external_skin"]) <= 480:
              raise SystemExit(f"expected small MDL fallback + high-res external atlas: {meta}")
          print(f"verified real Lab zombie MDL: {numverts} verts / {numtris} tris / {numframes} frames / {skinw}x{skinh}")
          PY
          grep -q 'sounds/ambience/wind2.wav' build/deps/quakec/source/server/main.qc
          grep -q 'invalid SOLID_BSP entity' build/deps/vril/source/world.c
          grep -q 'xziel_waw_round1_ready' build/deps/quakec/source/server/defs/custom.qc
          grep -q 'waw_round_start_laugh.wav' build/deps/quakec/source/server/main.qc
          grep -q 'splash_tune = xziel_waw_round1_path' build/deps/quakec/source/server/main.qc
          grep -q 'xziel_waw_gameover_ready' build/deps/quakec/source/server/damage.qc
          grep -q 'ADS+FIRE deliberately uses the bullet-over-reticle art' build/deps/vril/source/render/r_hud.c
          grep -q 'i==0 ? 112 : 76' build/deps/vril/source/render/r_hud.c
          grep -q 'xziel_weapon_card_active' build/deps/vril/source/render/r_hud.c
          grep -q '0.050f, "JUMP"' build/deps/vril/source/render/r_hud.c
          grep -q '0.050f, "SLIDE"' build/deps/vril/source/render/r_hud.c
          test -s build/nzp-data/nzp/gfx/xziel/fire.png
          test -s build/nzp-data/nzp/gfx/xziel/ads.png
          test -s build/nzp-data/nzp/gfx/xziel/reload.png
          test -s build/nzp-data/nzp/gfx/xziel/slide.png
          test -s build/nzp-data/nzp/gfx/xziel/weapon_card_active.png
          test -s build/nzp-data/nzp/gfx/xziel/weapon_card_inactive.png
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("build/nzp-data/nzp/gfx/xziel")
          names = [
              "weapon_colt","weapon_revolver","weapon_kar","weapon_kar_scope",
              "weapon_thompson","weapon_bar","weapon_ballistic","weapon_browning",
              "weapon_doublebarrel","weapon_sawnoff","weapon_fg42","weapon_gewehr",
              "weapon_m1","weapon_m1a1","weapon_flamer","weapon_mp40","weapon_mg42",
              "weapon_panzer","weapon_ppsh","weapon_ptrs","weapon_ray","weapon_raymk2",
              "weapon_stg","weapon_trench","weapon_type100","weapon_mp5",
              "weapon_tesla","weapon_springfield"
          ]
          digests = {}
          for name in names:
              path = root / f"{name}.png"
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f"missing dedicated weapon silhouette: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest in digests:
                  raise SystemExit(f"duplicate silhouettes: {digests[digest]} and {name}")
              digests[digest] = name
          print(f"verified {len(names)} unique dedicated weapon silhouettes")
          PY
          grep -q 'KILLS  %d     HEADSHOTS' build/deps/quakec/source/client/hud.qc
          test -s build/nzp-data/nzp/textures/nacht_enhanced/nduwall.jpg
          test -s build/nzp-data/nzp/textures/nacht_enhanced/cons5nny3.jpg
          test -s build/nzp-data/nzp/textures/nacht_enhanced/debris_hnf3p.jpg
          test -s build/nzp-data/nzp/textures/nacht_enhanced/ground_hb3.jpg
          test -s build/nzp-data/nzp/textures/nacht_enhanced/NDUWALL.jpg
          test -s build/nzp-data/nzp/textures/nacht_enhanced/NDU_DOORS_64.jpg
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{RAILLING_NDU.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{BOARD_FE.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{BARBED_WIRE_V.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{railling_ndu.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{board_fe.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{barbed_wire_v.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{metal_rail7.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{camo_2.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{clfnd.png'
          test -s build/nzp-data/nzp/maps/ndu_enchanted.bsp
          test -s build/nzp-data/nzp/maps/ndu_enchanted.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path("build/nzp-data/nzp/maps/ndu_enchanted.bsp")
          data = path.read_bytes()
          version = struct.unpack_from("<i", data, 0)[0]
          if version != 30:
              raise SystemExit(f"unexpected BSP version {version}")
          tex_off, tex_len = struct.unpack_from("<ii", data, 4 + 2 * 8)
          lump = data[tex_off:tex_off + tex_len]
          count = struct.unpack_from("<i", lump, 0)[0]
          table = struct.unpack_from("<" + "i" * count, lump, 4)
          missing = []
          for entry_off in table:
              if entry_off < 0:
                  continue
              name = lump[entry_off:entry_off + 16].split(b"\\0", 1)[0].decode("latin1")
              width, height, mip0 = struct.unpack_from("<III", lump, entry_off + 16)
              if mip0 == 0:
                  missing.append(f"{name}({width}x{height})")
          if missing:
              raise SystemExit("ndu_enchanted has unembedded WAD textures: " + ", ".join(missing))
          print(f"verified {count} BSP texture slots with embedded fallback pixels")
          PY
          test -s build/nzp-data/nzp/gfx/env/xziel_enchantbk.tga
          test -s build/nzp-data/nzp/gfx/env/xziel_enchantft.tga
          test -s build/nzp-data/nzp/gfx/env/xziel_enchantup.tga
          if cmp -s build/nzp-data/nzp/maps/ndu.bsp build/nzp-data/nzp/maps/ndu_enchanted.bsp; then
            echo "ndu_enchanted.bsp must be a separately compiled derivative, not a copied stock BSP"
            exit 1
          fi
          test -s build/nzp-data/nzp/models/machines/mystery.mdl_0.tga
          test -s build/nzp-data/nzp/models/props/mystery_debris.mdl_0.tga
          test -s build/nzp-data/nzp/models/ai/zfull.mdl_0.tga
          test -s build/nzp-data/nzp/models/ai/zfull.mdl_1.tga
          test -s build/nzp-data/nzp/models/ai/zfull.mdl_2.tga
          test -s build/nzp-data/nzp/models/ai/zfull.mdl_3.tga
          test -s build/nzp-data/nzp/sounds/xziel/enchant/round_omen.wav
          test -s build/nzp-data/nzp/sounds/xziel/enchant/mystery_hum.wav
          test -s build/nzp-data/nzp/sounds/xziel/enchant/gameover_guitar.wav
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{CHK_ASCEND.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{CHK_SALVAT.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{chk_ascend.png'
          test -s 'build/nzp-data/nzp/textures/nacht_enhanced/{chk_salvat.png'
          grep -q 'Mystery Box: cold violet supernatural pool' build/deps/quakec/source/client/main.qc
          grep -q 'sounds/xziel/enchant/round_omen.wav' build/deps/quakec/source/server/main.qc
          grep -q 'sounds/xziel/enchant/gameover_guitar.wav' build/deps/quakec/source/server/damage.qc
          test -s build/nzp-data/nzp/licenses/XZIEL-WAW-REFERENCE-AUDIO.txt
          if find build/nzp-data/nzp/sounds/xziel/waw -type f -name '*.wav' 2>/dev/null | grep -q .; then
            echo "Unexpected copyrighted/local WaW audio entered default CI package"
            exit 1
          fi

      - name: Build debug APK
        working-directory: build/android-project
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify Enhanced payload inside APK
        shell: bash
        run: |
          APK="build/android-project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -p "$APK" assets/nzp-data.zip > build/apk-nzp-data.zip
          test -s build/apk-nzp-data.zip
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/nduwall.jpg'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/cons5nny3.jpg'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/debris_hnf3p.jpg'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/ground_hb3.jpg'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/NDUWALL.jpg'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/NDU_DOORS_64.jpg'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{RAILLING_NDU.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{BOARD_FE.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/maps/ndu_enchanted.bsp'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/maps/ndu_enchanted.txt'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/gfx/env/xziel_enchantbk.tga'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/gfx/env/xziel_enchantup.tga'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/models/machines/mystery.mdl_0.tga'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/models/ai/zfull.mdl_0.tga'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/models/xziel_lab/zombie_basic.mdl'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/models/xziel_lab/zombie_basic.mdl_0.tga'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/models/xziel_lab/zombie_basic.json'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/licenses/XZIEL-QUATERNIUS-ZOMBIE-CC0.txt'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/sounds/xziel/enchant/round_omen.wav'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/sounds/xziel/enchant/mystery_hum.wav'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/sounds/xziel/enchant/gameover_guitar.wav'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{CHK_ASCEND.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{CHK_SALVAT.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{barbed_wire_v.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{clfnd.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/textures/nacht_enhanced/{chk_ascend.png'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/licenses/NACHT-ENHANCED-CC0-SOURCES.txt'
          unzip -l build/apk-nzp-data.zip | grep -q 'nzp/licenses/XZIEL-WAW-REFERENCE-AUDIO.txt'

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/android-project/app/build/outputs/apk/debug/app-debug.apk              dist/Xziel-NZP-native-universal-debug.apk
          ls -lh dist/Xziel-NZP-native-universal-debug.apk

      - name: Boot emulator and smoke-test Xziel
        id: smoke
        shell: bash
        continue-on-error: true
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/xziel-avd-home
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          ADB="${ANDROID_HOME}/platform-tools/adb"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          AVDMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"

          printf 'no\n' | "$AVDMANAGER" create avd             --force             --name xziel-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_6"

          echo "Created AVDs:"
          "$AVDMANAGER" list avd
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi

          nohup "$EMULATOR"             @xziel-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -memory 2048             > dist/emulator-stdout.txt 2>&1 &
          EMU_PID=$!

          sleep 5
          if ! kill -0 "$EMU_PID" 2>/dev/null; then
            cat dist/emulator-stdout.txt || true
            exit 1
          fi

          timeout 120 "$ADB" wait-for-device

          BOOTED=0
          for i in $(seq 1 60); do
            if [[ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done

          if [[ "$BOOTED" != "1" ]]; then
            echo "Emulator boot timeout"
            "$ADB" devices -l || true
            cat dist/emulator-stdout.txt || true
            exit 1
          fi

          "$ADB" install -r dist/Xziel-NZP-native-universal-debug.apk
          # Suppress Android's one-time immersive-mode tutorial so screenshots
          # show the game instead of the system education overlay.
          "$ADB" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ADB" logcat -c

          collect_runtime_diagnostics() {
            "$ADB" logcat -d -v threadtime > dist/xziel-logcat.txt 2>/dev/null || true
            "$ADB" shell dumpsys activity activities > dist/activity-activities.txt 2>/dev/null || true
            "$ADB" shell dumpsys activity processes > dist/activity-processes.txt 2>/dev/null || true
            "$ADB" shell dumpsys window displays > dist/window-displays.txt 2>/dev/null || true
            "$ADB" shell dumpsys display > dist/display.txt 2>/dev/null || true
          }
          trap collect_runtime_diagnostics EXIT

          "$ADB" shell am force-stop com.xziel.nzp || true
          "$ADB" shell am start -W -n com.xziel.nzp/org.libsdl.app.NZPActivity \
            --ez xziel_ci_nacht_enhanced_preview true \
            > dist/am-start.txt 2>&1 || true

          # Data extraction + direct map load can take longer than menu boot.
          sleep 30
          collect_runtime_diagnostics

          PID="$("$ADB" shell pidof com.xziel.nzp 2>/dev/null | tr -d '\r' || true)"
          RESUMED="$(grep -Em1 '(^|[[:space:]])(mResumedActivity|ResumedActivity|topResumedActivity)[=:]' dist/activity-activities.txt || true)"
          echo "PID=$PID" | tee dist/runtime-state.txt
          echo "RESUMED=$RESUMED" | tee -a dist/runtime-state.txt

          if [[ -z "$PID" ]]; then
            echo "Xziel process exited before visual validation."
            grep -Ei "FATAL EXCEPTION|Fatal signal|AndroidRuntime|DEBUG|libmain|gl4es|SDL|xziel|com.xziel.nzp|Vril Engine|Sys_Error|EGL_BAD_CONTEXT|stage=" \
              dist/xziel-logcat.txt | tail -n 500 || true
            exit 1
          fi

          # A Vril Sys_Error can leave Android's Activity alive while showing
          # a modal error dialog. Treat the stage marker/log line as fatal
          # before screenshot heuristics have a chance to mistake that dialog
          # for a valid non-flat game frame.
          if grep -Fq "stage=SYS_ERROR" dist/xziel-logcat.txt; then
            echo "Vril reached SYS_ERROR before visual validation."
            grep -F "stage=SYS_ERROR" dist/xziel-logcat.txt | tail -n 20 || true
            exit 1
          fi
          if grep -Fq "has a skin taller than" dist/xziel-logcat.txt; then
            echo "Legacy alias skin-height rejection detected."
            exit 1
          fi

          if [[ "$RESUMED" != *"com.xziel.nzp/org.libsdl.app.NZPActivity"* ]]; then
            echo "Xziel is alive but is not the resumed foreground activity."
            exit 1
          fi

          "$ADB" exec-out screencap -p > dist/xziel-enhanced-a.png || true
          sleep 3
          "$ADB" exec-out screencap -p > dist/xziel-enhanced-b.png || true
          cp dist/xziel-enhanced-a.png dist/xziel-screen.png || true

          # Two non-flat landscape frames plus a measurable delta prove that
          # the Enhanced map rendered and the renderer is alive, not frozen.
          python3 -m pip install --quiet pillow==11.3.0
          python3 - <<'PY' > dist/enhanced-visual-report.txt
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat

          paths = [Path("dist/xziel-enhanced-a.png"), Path("dist/xziel-enhanced-b.png")]
          images = []
          for path in paths:
              im = Image.open(path).convert("RGB")
              if im.width < 1000 or im.height < 500 or im.width <= im.height:
                  raise SystemExit(f"Enhanced preview has invalid dimensions: {path} {im.size}")
              gray = im.convert("L")
              stat = ImageStat.Stat(gray)
              lo, hi = gray.getextrema()
              if hi - lo < 24 or stat.stddev[0] < 8:
                  raise SystemExit(
                      f"Enhanced preview appears blank/flat: {path} extrema={(lo, hi)} std={stat.stddev[0]:.2f}"
                  )
              images.append(im)
              print(
                  f"{path.name}: size={im.size} mean={stat.mean[0]:.2f} "
                  f"std={stat.stddev[0]:.2f} extrema={(lo, hi)}"
              )

          diff = ImageChops.difference(images[0], images[1]).convert("L")
          dstat = ImageStat.Stat(diff)
          print(f"frame_delta_mean={dstat.mean[0]:.3f} frame_delta_std={dstat.stddev[0]:.3f}")
          if dstat.mean[0] < 0.01 and dstat.stddev[0] < 0.05:
              raise SystemExit("Enhanced preview appears frozen: frames are effectively identical")
          PY
          cat dist/enhanced-visual-report.txt

          collect_runtime_diagnostics

          PID="$("$ADB" shell pidof com.xziel.nzp 2>/dev/null | tr -d '\\r' || true)"
          echo "PID=$PID"

          echo "===== DEVICE STARTUP MARKER ====="
          "$ADB" shell run-as com.xziel.nzp cat files/nzp-runtime/.xziel-stage 2>/dev/null || true
          "$ADB" shell run-as com.xziel.nzp cat files/nzp-runtime/.xziel-last-error 2>/dev/null || true

          echo "===== XZIEL LOGCAT HIGHLIGHTS ====="
          grep -Ei "FATAL EXCEPTION|Fatal signal|AndroidRuntime|DEBUG|libmain|gl4es|SDL|xziel|com.xziel.nzp|Vril Engine|Sys_Error|EGL_BAD_CONTEXT|stage=SYS_ERROR|stage=HOST_INIT_OK|stage=FIRST_FRAME_OK" \
            dist/xziel-logcat.txt | tail -n 500 || true

          if grep -Eq "Fatal signal .*SDLActivity|>>> com\\.xziel\\.nzp <<<|Process .*com\\.xziel\\.nzp.*exited due to signal|EGL_BAD_CONTEXT|stage=SYS_ERROR" dist/xziel-logcat.txt; then
            echo "Detected native Xziel/EGL crash in logcat."
            exit 1
          fi

          if [[ -z "$PID" ]]; then
            echo "Xziel process is not alive after smoke test."
            exit 1
          fi

          STAGE="$("$ADB" shell run-as com.xziel.nzp cat files/nzp-runtime/.xziel-stage 2>/dev/null | tr -d '\\r' || true)"
          if [[ "$STAGE" != "FIRST_FRAME_OK" ]]; then
            echo "Xziel is alive but did not reach FIRST_FRAME_OK (stage=$STAGE)."
            exit 1
          fi

          echo "Xziel remained alive and reached FIRST_FRAME_OK after 20 seconds."

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-runtime-diagnostics
          path: |
            dist/xziel-logcat.txt
            dist/xziel-screen.png
            dist/xziel-enhanced-a.png
            dist/xziel-enhanced-b.png
            dist/enhanced-visual-report.txt
            dist/emulator-stdout.txt
            dist/am-start.txt
            dist/activity-processes.txt
            dist/activity-activities.txt
            dist/window-displays.txt
            dist/display.txt
            dist/runtime-state.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xziel-NZP-native-universal-debug
          path: dist/Xziel-NZP-native-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail if smoke test failed
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Publish final CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          case "$JOB_STATUS" in
            success) STATE=success ;;
            cancelled) STATE=error ;;
            *) STATE=failure ;;
          esac
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="xziel/android-enhanced" \
            -f description="Nacht Enhanced Android build: $JOB_STATUS" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null || true
