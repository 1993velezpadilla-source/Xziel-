name: BO3 Nacht Mindmirror Pack Audit

on:
  push:
    branches:
      - experiment/bo3-nacht-mindmirror-pack-audit
    paths:
      - ".github/workflows/bo3-nacht-mindmirror-pack-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y megatools p7zip-full file
      - name: Download public Mindmirror Nacht model pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mindmirror"
          cd "$RUNNER_TEMP/mindmirror"
          megadl 'https://mega.nz/#!haB3lLYQ!Fo0xWgK90yUwiPr7hGtCXsG6I9CjFTo3Jdc2D8mdU7Y'
          find . -maxdepth 1 -type f -printf '%s %p\n' | sort -nr | head -20
          FILE=$(find . -maxdepth 1 -type f -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -n "$FILE"
          echo "PACK=$RUNNER_TEMP/mindmirror/${FILE#./}" >> "$GITHUB_ENV"
      - name: Inventory
        run: |
          set -euo pipefail
          mkdir -p audit-out
          sha256sum "$PACK" | tee audit-out/payload.sha256
          file "$PACK" | tee audit-out/payload.filetype
          7z l -slt "$PACK" > audit-out/archive-list.txt
          python3 - <<'PY'
          import collections,json,pathlib
          txt=pathlib.Path('audit-out/archive-list.txt').read_text(errors='replace')
          paths=[]; sizes={}; current=None
          for line in txt.splitlines():
            if line.startswith('Path = '):
              current=line[7:].strip(); paths.append(current)
            elif current and line.startswith('Size = '):
              try:sizes[current]=int(line[7:].strip())
              except:pass
          ext=collections.Counter((pathlib.PurePath(p).suffix.lower() or '<none>') for p in paths)
          report={'entries':len(paths),'extensions':dict(ext.most_common()),'paths':paths,'largest':sorted(({'path':p,'bytes':sizes.get(p,0)} for p in paths),key=lambda x:-x['bytes'])[:200]}
          pathlib.Path('audit-out/inventory.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2)[:50000])
          PY
      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: bo3-nacht-mindmirror-pack-audit
          path: audit-out/
          retention-days: 7
