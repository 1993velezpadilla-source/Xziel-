name: Diegetic Ads Policy

on:
  pull_request:
    paths:
      - "ads/**"
      - "tools/ads/**"
      - ".github/workflows/diegetic-ads-policy.yml"
  push:
    branches: [main]
    paths:
      - "ads/**"
      - "tools/ads/**"
      - ".github/workflows/diegetic-ads-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate player-first ad policy
        run: python tools/ads/validate_diegetic_ads.py
