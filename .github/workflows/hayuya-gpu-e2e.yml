name: Hayuya GPU E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hayuya-gpu-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, linux, x64, hayuya-gpu]
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Run one-photo GPU proof
        run: bash tools/hayuya3d/gpu_e2e.sh

      - name: Upload HAYUYA GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hayuya-gpu-e2e
          path: out/gpu-e2e/**
          if-no-files-found: warn
          retention-days: 14
