name: Deploy Xziel Match Server

on:
  workflow_dispatch:
  push:
    branches:
      - engine/online-4p-foundation-v1
    paths:
      - "services/xziel-match-server/**"
      - ".github/workflows/xziel-match-server-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install match server dependencies
        working-directory: services/xziel-match-server
        run: npm install --ignore-scripts

      - name: Typecheck match server
        working-directory: services/xziel-match-server
        run: npm run typecheck

      - name: Deploy Cloudflare Worker
        working-directory: services/xziel-match-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XZIEL_TEST_KEY: ${{ secrets.XZIEL_TEST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [[ -z "$XZIEL_TEST_KEY" ]]; then
            echo "::error::Missing repository secret XZIEL_TEST_KEY"
            exit 1
          fi

          SUBDOMAIN_JSON="$(
            curl -sS \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"

          SUBDOMAIN="$(
            printf '%s' "$SUBDOMAIN_JSON" |
            python3 -c 'import json,sys; data=json.load(sys.stdin); print((data.get("result") or {}).get("subdomain") or "")'
          )"

          if [[ -z "$SUBDOMAIN" ]]; then
            SUBDOMAIN="xziel-${CLOUDFLARE_ACCOUNT_ID:0:8}"

            curl -fsS \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$SUBDOMAIN\"}" \
              > /tmp/xziel-workers-subdomain.json

            python3 - /tmp/xziel-workers-subdomain.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle)

          if not data.get("success"):
              raise SystemExit(
                  "Cloudflare Workers subdomain creation failed: " +
                  json.dumps(data.get("errors", []))
              )

          print(
              "XZIEL_WORKERS_SUBDOMAIN_READY " +
              data["result"]["subdomain"]
          )
          PY
          else
            echo "XZIEL_WORKERS_SUBDOMAIN_READY $SUBDOMAIN"
          fi

          npx wrangler deploy

          printf '%s' "$XZIEL_TEST_KEY" |
            npx wrangler secret put XZIEL_TEST_KEY

          BASE_URL="https://xziel-match-server.$SUBDOMAIN.workers.dev"
          HEALTH_URL="$BASE_URL/health"

          SCRIPT_SUBDOMAIN_JSON="$(
            curl -fsS \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/xziel-match-server/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          )"

          printf '%s' "$SCRIPT_SUBDOMAIN_JSON" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("success"); assert (d.get("result") or {}).get("enabled") is True; print("XZIEL_MATCH_SERVER_ROUTE_ENABLED")'

          HEALTH_OK=0
          for attempt in $(seq 1 36); do
            if curl -fsS "$HEALTH_URL" > /tmp/xziel-health.json; then
              HEALTH_OK=1
              break
            fi
            sleep 5
          done

          echo "XZIEL_MATCH_SERVER_URL=$BASE_URL"
          echo "XZIEL_MATCH_SERVER_WS=wss://xziel-match-server.$SUBDOMAIN.workers.dev"

          if [[ "$HEALTH_OK" -eq 1 ]]; then
            python3 - /tmp/xziel-health.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle)

          if not data.get("ok"):
              raise SystemExit("Xziel match server health check failed")

          if data.get("maxPlayers") != 4:
              raise SystemExit(
                  "Unexpected match capacity: " +
                  str(data.get("maxPlayers"))
              )

          print(
              "XZIEL_MATCH_SERVER_HEALTH_OK " +
              json.dumps(data, sort_keys=True)
          )
          PY
          else
            echo "::warning::Worker deployed and route enabled; workers.dev TLS/DNS is still propagating"
            echo "XZIEL_MATCH_SERVER_PROPAGATING"
          fi

          echo "XZIEL_MATCH_SERVER_DEPLOY_OK"
