name: Pavlov BO3 Nacht WallBuy Repair Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-wallbuy-repair-audit.yml"
      - "experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v2.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate calibrated nine-slot repair plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("experiments/bo3_nacht_reference/nacht_wallbuy_repair_plan_v2.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          slots = doc.get("purchase_slots", [])
          errors = []

          expected = {
              "purchase_arak": ("KN-44", "wallbuy", 1400),
              "purchase_argus": ("Argus", "wallbuy", 1100),
              "purchase_frag": ("Fragmentation Grenades", "equipment", 250),
              "purchase_krm": ("KRM-262", "wallbuy", 750),
              "purchase_kuda": ("Kuda", "wallbuy", 1250),
              "purchase_locus_decal": ("Locus", "sniper_cabinet", 5000),
              "purchase_pharaoh": ("Pharo", "wallbuy", 700),
              "purchase_shiva": ("Sheiva", "wallbuy", 500),
              "purchase_triton": ("RK5", "wallbuy", 500),
          }

          by_id = {row.get("id"): row for row in slots}
          if len(slots) != 9 or len(by_id) != 9:
              errors.append(
                  f"expected 9 unique slots, got {len(slots)} rows / {len(by_id)} unique"
              )

          for slot_id, (name, kind, price) in expected.items():
              row = by_id.get(slot_id)
              if row is None:
                  errors.append(f"missing {slot_id}")
                  continue
              if row.get("canonical") != name:
                  errors.append(f"{slot_id}: wrong name {row.get('canonical')!r}")
              if row.get("type") != kind:
                  errors.append(f"{slot_id}: wrong type {row.get('type')!r}")
              if row.get("price") != price:
                  errors.append(f"{slot_id}: wrong price {row.get('price')}")
              if row.get("needs_geometry_resolution") is not False:
                  errors.append(f"{slot_id}: geometry unresolved")
              if row.get("replicationPolicy") != "server_authoritative":
                  errors.append(f"{slot_id}: replication must be server_authoritative")
              if float(row.get("interaction_radius_cm", 0)) <= 0:
                  errors.append(f"{slot_id}: invalid interaction radius")

              for key in ("interaction_location_ue_cm", "interaction_location_xziel_m"):
                  pos = row.get(key)
                  if not isinstance(pos, dict):
                      errors.append(f"{slot_id}: missing {key}")
                      continue
                  values = [pos.get(axis) for axis in ("x", "y", "z")]
                  if not all(
                      isinstance(value, (int, float))
                      and math.isfinite(float(value))
                      for value in values
                  ):
                      errors.append(f"{slot_id}: invalid {key}")

          functional = [
              slot for slot in slots
              if slot.get("placement_source") == "functional_wallbuy_actor"
          ]
          derived = [
              slot for slot in slots
              if slot.get("placement_source") == "calibrated_marker_mesh_bounds"
          ]
          if len(functional) != 3:
              errors.append(f"expected 3 functional anchors, got {len(functional)}")
          if len(derived) != 6:
              errors.append(f"expected 6 reconstructed slots, got {len(derived)}")

          rmse = float((doc.get("calibration") or {}).get("rmse_cm", math.inf))
          if not math.isfinite(rmse) or rmse > 10.0:
              errors.append(f"calibration RMSE too high: {rmse}")

          validation = doc.get("validation") or {}
          if validation.get("gate") != "PASS":
              errors.append("stored validation gate is not PASS")
          if validation.get("unresolved_slot_count") != 0:
              errors.append("stored manifest reports unresolved slots")

          result = {
              "slot_count": len(slots),
              "functional_anchor_count": len(functional),
              "reconstructed_count": len(derived),
              "calibration_rmse_cm": rmse,
              "unresolved": sum(
                  1 for slot in slots
                  if slot.get("needs_geometry_resolution")
              ),
              "errors": errors,
          }
          print(json.dumps(result, indent=2))
          if errors:
              raise SystemExit(3)
          PY
