name: Probe Hunyuan3D 2mv API

on:
  workflow_dispatch:
  push:
    branches:
      - art/llorona-meshy-pipeline
    paths:
      - .github/workflows/probe-hunyuan2mv-api.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Gradio client
        run: python3 -m pip install --upgrade "gradio_client>=1.10,<2"
      - name: Print Hunyuan3D-2mv API
        run: |
          python3 - <<'PY'
          import json
          from gradio_client import Client
          c=Client("tencent/Hunyuan3D-2mv", verbose=True)
          info=c.view_api(print_info=False, return_format="dict")
          print(json.dumps(info, indent=2, default=str))
          PY
