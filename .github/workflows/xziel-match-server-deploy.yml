name: Deploy Xziel Match Server

on:
  workflow_dispatch:
  push:
    branches:
      - engine/online-4p-foundation-v1
    paths:
      - "services/xziel-match-server/**"
      - ".github/workflows/xziel-match-server-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install match server dependencies
        working-directory: services/xziel-match-server
        run: npm install --ignore-scripts

      - name: Typecheck match server
        working-directory: services/xziel-match-server
        run: npm run typecheck

      - name: Deploy Cloudflare Worker
        working-directory: services/xziel-match-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XZIEL_TEST_KEY: ${{ secrets.XZIEL_TEST_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [[ -z "$XZIEL_TEST_KEY" ]]; then
            echo "::error::Missing repository secret XZIEL_TEST_KEY"
            exit 1
          fi

          npx wrangler deploy
          printf '%s' "$XZIEL_TEST_KEY" | npx wrangler secret put XZIEL_TEST_KEY
          echo "XZIEL_MATCH_SERVER_DEPLOY_OK"
