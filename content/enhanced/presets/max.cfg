// Xziel Enhanced MAX - Vril-safe v1 draft
// 2048 is experimental on Android and must fall back to 1024 if memory/stability suffers.
r_retro 0
r_dithering 0
gl_texturemode GL_LINEAR_MIPMAP_LINEAR
gl_max_size 2048
gl_picmip 0
r_dynamic 1
gl_flashblend 0
r_shadows 1
r_model_brightness 0
r_part_explosions 1
r_part_trails 1
r_part_sparks 1
r_part_blood 1
r_part_flames 1
r_part_muzzleflash 1

// NOTE:
// Vril currently does not expose FTE's realtime shadow-map, bloom, HDR,
// normal-map, specular-map or .rtlights pipeline.
// Do not add those cvars here unless the Android renderer gains that support.
