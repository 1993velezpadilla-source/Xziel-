name: Project Aether Public Build Audit

on:
  push:
    branches:
      - experiment/project-aether-golden-reference
    paths:
      - ".github/workflows/project-aether-public-build-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout XZIEL
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full file
          npm --version
          node --version

      - name: Download official free Project Aether build from itch.io
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aether-download"
          npx --yes itchio-downloader \
            --url "https://verrial.itch.io/projectaether" \
            --downloadDirectory "$RUNNER_TEMP/aether-download"
          find "$RUNNER_TEMP/aether-download" -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Locate primary payload
        run: |
          set -euo pipefail
          FILE=$(find "$RUNNER_TEMP/aether-download" -type f -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)
          test -n "$FILE"
          echo "PAYLOAD=$FILE" >> "$GITHUB_ENV"
          echo "Largest downloaded payload: $FILE"
          ls -lh "$FILE"
          sha256sum "$FILE" | tee payload.sha256
          file "$FILE" | tee payload.filetype.txt

      - name: List archive/package contents without extracting
        run: |
          set +e
          mkdir -p audit-out
          cp payload.sha256 payload.filetype.txt audit-out/
          7z l -slt "$PAYLOAD" > audit-out/archive-list.txt 2>&1
          RC=$?
          echo "7z list rc=$RC"
          python3 - <<'PY'
          import json, os, pathlib, re
          p=pathlib.Path('audit-out/archive-list.txt')
          txt=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          paths=[]
          for line in txt.splitlines():
              if line.startswith('Path = '):
                  paths.append(line[7:].strip())
          interesting=[]
          needles=('nacht','prototype','zombie','content/paks','projectaether','.pak','.utoc','.ucas','.uproject','.umap','.uasset','.exe')
          for x in paths:
              low=x.lower()
              if any(n in low for n in needles): interesting.append(x)
          ext={}
          for x in paths:
              s=pathlib.PurePosixPath(x).suffix.lower() or '<none>'
              ext[s]=ext.get(s,0)+1
          report={
            'file_entries':len(paths),
            'extensions':dict(sorted(ext.items(),key=lambda kv:(-kv[1],kv[0]))),
            'interesting_paths':interesting[:5000],
          }
          pathlib.Path('audit-out/public-build-inventory.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2)[:30000])
          PY
          exit 0

      - name: Upload audit report only
        uses: actions/upload-artifact@v4
        with:
          name: project-aether-public-build-audit
          path: audit-out/
          if-no-files-found: error
          retention-days: 7
