name: Pavlov BO3 Nacht UAssetGUI Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/bo3-nacht-standalone-audit
    paths:
      - ".github/workflows/pavlov-bo3-nacht-uassetgui-audit.yml"
      - "tools/maps/extract_pavlov_nacht_layout.py"
      - "tools/maps/resolve_pavlov_nacht_purchase_slots.py"
      - "tools/maps/build_xziel_nacht_reference_package.py"

jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download Pavlov Nacht Workshop with SteamCMD
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $steam=Join-Path $env:RUNNER_TEMP 'steamcmd'
          New-Item -ItemType Directory -Force -Path $steam | Out-Null
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'steamcmd.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'steamcmd.zip') -DestinationPath $steam -Force
          & (Join-Path $steam 'steamcmd.exe') +login anonymous +workshop_download_item 555160 2755515831 validate +quit
          $root=Get-ChildItem $steam,$env:RUNNER_TEMP -Directory -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName -like '*steamapps\workshop\content\555160\2755515831'} | Select-Object -First 1
          if(-not $root){throw 'payload not found'}
          $pak=Join-Path $root.FullName 'WindowsNoEditor.pak'
          if(-not (Test-Path $pak)){throw 'pak not found'}
          "PAK=$pak" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Download repak and UAssetGUI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip' -OutFile (Join-Path $env:RUNNER_TEMP 'repak.zip')
          $repakDir=Join-Path $env:RUNNER_TEMP 'repak'
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'repak.zip') -DestinationPath $repakDir -Force
          $repak=Get-ChildItem $repakDir -Filter repak.exe -Recurse | Select-Object -First 1
          if(-not $repak){throw 'repak.exe missing'}
          "REPAK=$($repak.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Invoke-WebRequest 'https://github.com/atenfyr/UAssetGUI/releases/download/v1.1.0/UAssetGUI.exe' -OutFile (Join-Path $env:RUNNER_TEMP 'UAssetGUI.exe')
          "UASSETGUI=$env:RUNNER_TEMP\UAssetGUI.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract Nacht map and MAP_FILES
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'pakextract'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:REPAK unpack $env:PAK -o $out
          if($LASTEXITCODE -ne 0){throw "repak unpack failed $LASTEXITCODE"}
          $map=Get-ChildItem $out -Filter 'Nacht_de_Untoten.umap' -Recurse | Select-Object -First 1
          if(-not $map){throw 'Nacht map missing after unpack'}
          "MAPFILE=$($map.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "UNPACKED=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $map.FullName | Format-List FullName,Length

      - name: Export map to UAssetAPI JSON
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          New-Item -ItemType Directory -Force -Path 'audit-out' | Out-Null
          & $env:UASSETGUI tojson $env:MAPFILE 'audit-out\Nacht_de_Untoten.json' VER_UE4_21 2>&1 | Tee-Object -FilePath 'audit-out\uassetgui.log'
          $rc=$LASTEXITCODE
          "$rc" | Set-Content 'audit-out\uassetgui.rc'
          Write-Host "UAssetGUI rc=$rc"
          exit 0

      - name: Extract spatial manifest
        shell: bash
        run: |
          python tools/maps/extract_pavlov_nacht_layout.py \
            audit-out/Nacht_de_Untoten.json \
            audit-out/nacht-spatial-manifest.json
      - name: Build BO3 purchase-marker glTF exporter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'nacht-purchase-exporter'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Push-Location $src
          dotnet new console --framework net10.0 --force
          dotnet add package CUE4Parse --version 1.2.2.202609
          dotnet add package CUE4Parse-Conversion --version 1.2.2.202609
          @'
          using CUE4Parse.FileProvider;
          using CUE4Parse.UE4.Versions;
          using CUE4Parse.UE4.Assets.Exports.StaticMesh;
          using CUE4Parse_Conversion;
          using CUE4Parse_Conversion.Options;

          if(args.Length<2) return 2;
          var provider=new DefaultFileProvider(
              args[0],
              SearchOption.AllDirectories,
              true,
              new VersionContainer(EGame.GAME_UE4_21));
          provider.Initialize();
          provider.PostMount();
          provider.LoadVirtualPaths();

          var session=new ExportSession{
              MaxDegreeOfParallelism=Math.Max(1,Environment.ProcessorCount/2)
          };
          int queued=0;
          foreach(var file in provider.Files.Values
              .Where(f=>f.IsUePackage
                  && f.Path.Contains("/CoD_nacht/MAP_FILES/",StringComparison.OrdinalIgnoreCase)
                  && f.Path.Contains("chalk_buy_",StringComparison.OrdinalIgnoreCase)
                  && f.Path.EndsWith(".uasset",StringComparison.OrdinalIgnoreCase))
              .OrderBy(f=>f.Path))
          {
              try
              {
                  foreach(var mesh in provider.LoadPackage(file.Path).GetExports().OfType<UStaticMesh>())
                  {
                      if(!mesh.Name.Contains("chalk_buy_",StringComparison.OrdinalIgnoreCase))
                          continue;
                      session.Add(mesh);
                      queued++;
                      Console.WriteLine("queued="+mesh.Name);
                  }
              }
              catch(Exception e)
              {
                  Console.WriteLine("skip="+file.Path+" :: "+e.Message);
              }
          }
          Console.WriteLine("queued_count="+queued);
          Directory.CreateDirectory(args[1]);
          var results=await session.RunAsync(
              args[1],
              new ExportOptions(meshFormat:EMeshFormat.Gltf2,exportMaterials:false));
          Console.WriteLine("result_count="+results.Count);
          return queued==9 && results.Count==9 ? 0 : 3;
          '@ | Set-Content Program.cs -Encoding utf8
          dotnet build -c Release
          Pop-Location
          "PURCHASE_EXPORTER=$src\bin\Release\net10.0\nacht-purchase-exporter.dll" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export nine BO3 purchase marker meshes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'audit-out\purchase-gltf'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet $env:PURCHASE_EXPORTER $env:UNPACKED $out 2>&1 | Tee-Object -FilePath 'audit-out\purchase-export.log'
          if($LASTEXITCODE -ne 0){throw "purchase marker export failed $LASTEXITCODE"}
          $glbs=Get-ChildItem $out -Filter '*.glb' -Recurse -ErrorAction SilentlyContinue
          Write-Host "purchase marker glbs=$($glbs.Count)"
          $glbs | Select-Object FullName,Length | Format-Table -AutoSize
          if($glbs.Count -ne 9){throw "expected 9 purchase marker GLBs, got $($glbs.Count)"}

      - name: Resolve all nine BO3 purchase slots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --quiet numpy trimesh
          python tools/maps/resolve_pavlov_nacht_purchase_slots.py audit-out/nacht-spatial-manifest.json audit-out/purchase-gltf audit-out/nacht-purchase-slots-resolved.json
          if($LASTEXITCODE -ne 0){throw "purchase slot resolver failed $LASTEXITCODE"}
      - name: Build XZIEL Nacht reference package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'audit-out\xziel-reference-package' | Out-Null
          python tools/maps/build_xziel_nacht_reference_package.py audit-out/nacht-spatial-manifest.json audit-out/nacht-purchase-slots-resolved.json audit-out/xziel-reference-package
          if($LASTEXITCODE -ne 0){throw "XZIEL reference package preflight failed $LASTEXITCODE"}
      - name: Upload map JSON audit
        uses: actions/upload-artifact@v4
        with:
          name: pavlov-bo3-nacht-uassetgui-audit
          path: audit-out/
          retention-days: 7
